<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase de pruebas finalizada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 45px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .icon-badge {
            width: 75px;
            height: 75px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 34px;
        }

        .tag {
            display: inline-block;
            background: #22c55e;
            color: #0f172a;
            font-weight: 700;
            font-size: 11px;
            padding: 5px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #ffffff;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 16px;
        }

        p:last-child {
            margin-bottom: 0;
        }

        .highlight {
            color: #38bdf8;
            font-weight: 600;
        }

        .note-box {
            margin-top: 24px;
            padding: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed rgba(56, 189, 248, 0.3);
            border-radius: 14px;
            font-size: 14px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-badge">🚀</div>
        <span class="tag">Versión Nativa</span>
        <h1>Fase de pruebas finalizada</h1>
        <p>
            Esta versión web de prueba ya no está disponible. El programa ha pasado oficialmente a ser una 
            <span class="highlight">aplicación nativa de Android</span>.
        </p>
        
        <div class="note-box">
            Si quieres seguir utilizándolo y tener la app en tu móvil, ya sabes: ponte en contacto conmigo directamente.
        </div>
    </div>

</body>
</html>
