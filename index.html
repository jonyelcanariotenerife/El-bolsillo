<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Quantum Finance · Bolsillo</title>

    <!-- PWA: manifest + iconos + colores de tema -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#020205" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bolsillo" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- React + ReactDOM + Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;900&display=swap" rel="stylesheet" />

    <style>
        html { -webkit-text-size-adjust: 100%; -moz-text-size-adjust: 100%; text-size-adjust: 100%; }

        * { box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020205; color: #e2e8f0; min-height: 100vh; padding-bottom: 40px; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(6px) scale(0.99); } to { opacity:1; transform:translateY(0) scale(1); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes slideIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }
        .animate-fade { animation: fadeIn 0.2s ease-out forwards; }
        .animate-pulse-soft { animation: pulse 1.5s ease-in-out infinite; }
        .expense-enter { animation: slideIn 0.25s ease-out forwards; }
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
        .week-grid { display: grid; grid-template-columns: 1fr 1.2fr 1.2fr 0.9fr 0.9fr 1fr; gap: 0.2rem 0.3rem; align-items: center; font-size: 0.7rem; }
        .week-grid .col-header { font-size: 0.6rem; text-transform: uppercase; font-weight: 800; color: #64748b; letter-spacing: 0.03em; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f111a; border: 1px solid rgba(255,255,255,0.1); border-left-width: 4px; padding: 12px 24px; border-radius: 16px; font-weight: 700; font-size: 0.8rem; z-index: 100; animation: fadeIn 0.3s ease-out; backdrop-filter: blur(8px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); max-width: 92vw; }
        .toast-success { border-left-color: #34d399; }
        .toast-warning { border-left-color: #fbbf24; }
        .toast-error   { border-left-color: #f87171; }
        .toast-info    { border-left-color: #38bdf8; }
        .mic-btn { transition: all 0.3s ease; }
        .mic-btn.active { background: rgba(239, 68, 68, 0.3); border-color: rgba(239, 68, 68, 0.5); animation: pulse 1s ease-in-out infinite; }
        .mic-btn:hover { transform: scale(1.05); }
        .total-hoy { transition: all 0.3s ease; }
        .btn-add { transition: all 0.2s ease; background: white; color: black; border: 1px solid rgba(255,255,255,0.1); }
        .btn-add:active { transform: scale(0.95); }
        .presupuesto-real { font-size: 2.35rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.01em; }
        .presupuesto-real small { font-size: 0.6rem; font-weight: 700; color: #94a3b8; }
        .banco-edit { cursor: pointer; transition: all 0.2s; }
        .banco-edit:hover { color: #818cf8; text-decoration: underline; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; height: 100dvh; }
    </style>
</head>
<body>
    <div id="root" class="max-w-md mx-auto"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        window.BolsilloServices = (function () {

            const LOG_ENABLED = true;
            const LOG_PREFIX = '[Bolsillo]';

            const logger = {
                info: (...args) => { if (LOG_ENABLED) console.log(LOG_PREFIX, new Date().toISOString(), ...args); },
                warn: (...args) => { if (LOG_ENABLED) console.warn(LOG_PREFIX, new Date().toISOString(), ...args); },
                error: (...args) => { if (LOG_ENABLED) console.error(LOG_PREFIX, new Date().toISOString(), ...args); },
            };

            const storage = {
                get(key, fallback = null) {
                    try {
                        const raw = localStorage.getItem(key);
                        return raw ? JSON.parse(raw) : fallback;
                    } catch (e) {
                        logger.error('storage.get falló para', key, e);
                        return fallback;
                    }
                },
                set(key, value) {
                    try {
                        localStorage.setItem(key, JSON.stringify(value));
                        return true;
                    } catch (e) {
                        logger.error('storage.set falló para', key, e);
                        return false;
                    }
                },
                remove(key) {
                    try {
                        localStorage.removeItem(key);
                        return true;
                    } catch (e) {
                        logger.error('storage.remove falló para', key, e);
                        return false;
                    }
                }
            };

            function syncWithPC(ip, port, pin, localData, onStatus) {
                let settled = false;
                const controller = new AbortController();

                const timeout = setTimeout(() => {
                    if (!settled) {
                        logger.warn('Timeout esperando respuesta del PC');
                        onStatus('error', 'El PC no respondió a tiempo. ¿Estás resolviendo algún conflicto en la pantalla de El Hilván?');
                        controller.abort();
                    }
                }, 35000);

                onStatus('connecting');
                logger.info('Conectando al PC via HTTP POST...');

                fetch(`http://${ip}:${port}/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin, deviceName: 'Bolsillo', syncData: localData }),
                    signal: controller.signal
                })
                .then(async response => {
                    settled = true;
                    clearTimeout(timeout);
                    
                    let data;
                    try {
                        data = await response.json();
                    } catch (e) {
                        onStatus('error', 'La respuesta del PC no es válida.');
                        return;
                    }
                    
                    if (response.ok && data.success) {
                        logger.info('Sincronización completada');
                        onStatus('success', data.mergedData);
                    } else if (response.status === 401) {
                        logger.warn('PIN incorrecto', data.error);
                        onStatus('auth_fail', data.error || 'PIN incorrecto');
                    } else {
                        logger.error('Error del servidor:', data.error);
                        onStatus('error', data.error || 'Error al procesar los datos en el PC');
                    }
                })
                .catch(err => {
                    if (!settled) {
                        settled = true;
                        clearTimeout(timeout);
                        if (err.name === 'AbortError') {
                            onStatus('error', 'Tiempo de espera agotado.');
                        } else {
                            logger.error('Error de red HTTP', err);
                            onStatus('error', 'No se pudo conectar. Comprueba la IP, el puerto y que estéis en la misma WiFi.');
                        }
                    }
                });

                return {
                    cancel: () => {
                        if (!settled) {
                            settled = true;
                            clearTimeout(timeout);
                            controller.abort();
                        }
                    }
                };
            }

            const WIDGET_DATA_KEY = 'bolsillo_widget_data';

            async function syncHomeScreenWidget(payload) {
                if (!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return;
                try {
                    const plugins = window.Capacitor.Plugins || {};
                    if (plugins.Preferences) {
                        await plugins.Preferences.set({ key: WIDGET_DATA_KEY, value: JSON.stringify(payload) });
                    }
                    if (plugins.BolsilloWidget && plugins.BolsilloWidget.refresh) {
                        await plugins.BolsilloWidget.refresh();
                    }
                } catch (e) {
                    logger.error('syncHomeScreenWidget falló', e);
                }
            }

            const CALC_SYNC_CACHE_KEY = 'bolsillo_last_calc_sync';
            const CALC_SYNC_FRESH_MS = 30 * 60 * 1000;

            function isNativePlatform() {
                return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
            }
            function getAppPlugin() {
                return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) || null;
            }

            function getUltimaSincronizacionCalculadora() {
                try {
                    const raw = localStorage.getItem(CALC_SYNC_CACHE_KEY);
                    if (!raw) return null;
                    const parsed = JSON.parse(raw);
                    if (typeof parsed.saldo !== 'number' || !parsed.at) return null;
                    return parsed;
                } catch (e) { return null; }
            }
            function guardarUltimaSincronizacionCalculadora(saldo) {
                try {
                    localStorage.setItem(CALC_SYNC_CACHE_KEY, JSON.stringify({ saldo, at: new Date().toISOString() }));
                } catch (e) {}
            }
            function esSincronizacionReciente(sync) {
                if (!sync) return false;
                const edadMs = Date.now() - new Date(sync.at).getTime();
                return edadMs >= 0 && edadMs <= CALC_SYNC_FRESH_MS;
            }

            let ultimaUrlCalcProcesada = null;
            let ultimaUrlCalcProcesadaEn = 0;
            const VENTANA_DEDUP_CALC_MS = 4000;
            function yaProcesadaUrlCalc(url) {
                const ahora = Date.now();
                if (url === ultimaUrlCalcProcesada && (ahora - ultimaUrlCalcProcesadaEn) < VENTANA_DEDUP_CALC_MS) return true;
                ultimaUrlCalcProcesada = url;
                ultimaUrlCalcProcesadaEn = ahora;
                return false;
            }

            function procesarUrlEntranteDeCalculadora(rawUrl, onDatos) {
                if (!rawUrl) return;
                try {
                    const url = new URL(rawUrl);
                    if (url.protocol !== 'bolsillo:') return;
                    const esRutaSincronizar = url.hostname === 'sincronizar' || url.pathname.replace(/^\/+/, '') === 'sincronizar';
                    if (!esRutaSincronizar) return;
                    const datosParam = url.searchParams.get('datos');
                    if (!datosParam) return;
                    if (yaProcesadaUrlCalc(rawUrl)) {
                        logger.info('Sincronización repetida ignorada (arranque en frío + listener en caliente).', rawUrl);
                        return;
                    }
                    const payload = JSON.parse(decodeURIComponent(datosParam));
                    if (typeof payload.saldo !== 'number') return;
                    guardarUltimaSincronizacionCalculadora(payload.saldo);
                    onDatos && onDatos(payload.saldo, { auto: url.searchParams.get('auto') === '1' });
                } catch (e) {
                    logger.error('No se pudo leer la sincronización entrante de la Calculadora', e);
                }
            }

            function escucharSincronizacionDesdeCalculadora(onDatos) {
                if (!isNativePlatform()) return;
                const App = getAppPlugin();
                if (!App) return;

                if (App.addListener) {
                    App.addListener('appUrlOpen', (data) => {
                        procesarUrlEntranteDeCalculadora(data && data.url, onDatos);
                    });
                }

                if (App.getLaunchUrl) {
                    App.getLaunchUrl()
                        .then((result) => procesarUrlEntranteDeCalculadora(result && result.url, onDatos))
                        .catch(() => {});
                }
            }

            async function abrirCalculadoraYPedirSaldo() {
                if (!isNativePlatform()) return false;
                const App = getAppPlugin();
                if (!App || !App.openUrl) return false;
                try {
                    await App.openUrl({ url: 'calculadora://sincronizar?solicita=1' });
                    return true;
                } catch (e) {
                    logger.warn('No se pudo abrir la Calculadora (¿está instalada?)', e);
                    return false;
                }
            }

            return {
                logger, storage, syncWithPC,
                widget: { sync: syncHomeScreenWidget, dataKey: WIDGET_DATA_KEY },
                calcSync: {
                    getUltima: getUltimaSincronizacionCalculadora,
                    esReciente: esSincronizacionReciente,
                    escuchar: escucharSincronizacionDesdeCalculadora,
                    pedirACalculadora: abrirCalculadoraYPedirSaldo
                }
            };
        })();

        const { logger, storage: BolsilloStorage, syncWithPC, calcSync } = window.BolsilloServices;

        const STORAGE_KEY = 'quantum_pocket_mobile_data';
        const VOICE_GUIDE_SHOWN_KEY = 'quantum_voice_guide_shown';
        const LAST_ACTIVITY_KEY = 'quantum_pocket_last_activity';
        const LAST_WEEKLY_BACKUP_KEY = 'quantum_pocket_last_weekly_backup';
        
        const CONCEPTS_KEY = 'quantum_pocket_recent_concepts';
        const CONCEPTS_MAX = 10;
        const CONCEPTS_MAX_AGE_DAYS = 60; 

        const generarIdReajuste = () => (
            (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID()
                : `reaj-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`
        );

        const DEFAULT_DATA = {
            presupuestoMioMensual: 439.12,
            presupuestoOriginalMes: 439.12,
            gastadoRecalibrado: 0,
            budgetReset: null,
            expenses: [],
            lastWeekRecalc: null,
            reajustes: [],
            banco: 'ING',
            cardOrder: ['hero', 'restante', 'ciclo', 'categorias', 'movimientos'],
            categoryOrder: ['Ocio', 'Alimentación', 'Gasolina Moto', 'Gasoil Coche', 'Combustible', 'Casa', 'Otros']
        };

        const CARD_IDS = ['hero', 'restante', 'ciclo', 'categorias', 'movimientos'];

        const CATEGORIAS_GASTO = ['Ocio', 'Alimentación', 'Gasolina Moto', 'Gasoil Coche', 'Combustible', 'Casa', 'Otros'];
        const COLORES_CATEGORIA = {
            'Ocio': '#818cf8',
            'Alimentación': '#34d399',
            'Gasolina Moto': '#06b6d4',
            'Gasoil Coche': '#fbbf24',
            'Combustible': '#a855f7',
            'Casa': '#f43f5e',
            'Otros': '#94a3b8',
            'Transporte': '#fbbf24'
        };
        const EMOJIS_CATEGORIA = {
            'Ocio': '🎮',
            'Alimentación': '🍕',
            'Gasolina Moto': '🏍️',
            'Gasoil Coche': '🚗',
            'Combustible': '⛽',
            'Casa': '🏠',
            'Otros': '📦',
            'Transporte': '🚌'
        };
        const emojiCategoria = (cat) => EMOJIS_CATEGORIA[cat] || '📦';

        const FEEDBACK_SETTINGS_KEY = 'quantum_pocket_feedback_settings';
        const DEFAULT_FEEDBACK_SETTINGS = { vibrationEnabled: true, soundEnabled: true, vibrationIntensity: 'media' };

        const loadFeedbackSettings = () => {
            try {
                const saved = localStorage.getItem(FEEDBACK_SETTINGS_KEY);
                if (!saved) return { ...DEFAULT_FEEDBACK_SETTINGS };
                return { ...DEFAULT_FEEDBACK_SETTINGS, ...JSON.parse(saved) };
            } catch (e) {
                logger.error('loadFeedbackSettings falló', e);
                return { ...DEFAULT_FEEDBACK_SETTINGS };
            }
        };

        const saveFeedbackSettings = (settings) => {
            try {
                localStorage.setItem(FEEDBACK_SETTINGS_KEY, JSON.stringify(settings));
            } catch (e) {
                logger.error('saveFeedbackSettings falló', e);
            }
        };

        const VIBRATION_INTENSITY_FACTOR = { baja: 0.5, media: 1, alta: 1.8 };

        const VIBRATION_PATTERNS = {
            click: [15],
            success: [25],
            error: [35, 50, 35]
        };

        const getVibrationPattern = (type, intensity) => {
            const factor = VIBRATION_INTENSITY_FACTOR[intensity] ?? 1;
            const base = VIBRATION_PATTERNS[type] || VIBRATION_PATTERNS.click;
            return base.map(ms => Math.max(5, Math.round(ms * factor)));
        };

        const getFeedbackType = (message) => {
            if (!message) return 'click';
            const level = getToastLevel(message);
            if (level === 'success') return 'success';
            if (level === 'warning' || level === 'error') return 'error';
            if (/^(🗑️|📁|📤|🛡️|📋)/.test(message)) return 'success';
            return 'click';
        };

        const playFeedbackSound = (ctx, type) => {
            if (!ctx) return;
            const now = ctx.currentTime;
            const playTone = (freq, start, duration, volume = 0.15, waveType = 'sine') => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = waveType;
                osc.frequency.setValueAtTime(freq, now + start);
                gain.gain.setValueAtTime(0, now + start);
                gain.gain.linearRampToValueAtTime(volume, now + start + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, now + start + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + start);
                osc.stop(now + start + duration + 0.02);
            };
            if (type === 'success') {
                playTone(523.25, 0, 0.1);
                playTone(783.99, 0.09, 0.15);
            } else if (type === 'error') {
                playTone(220, 0, 0.12, 0.14, 'square');
                playTone(160, 0.1, 0.18, 0.14, 'square');
            } else {
                playTone(880, 0, 0.06, 0.1);
            }
        };

        const getToastLevel = (message) => {
            if (!message) return 'info';
            if (message.startsWith('✅')) return 'success';
            if (message.startsWith('⚠️')) {
                return /error|denegad|inválid|no válido/i.test(message) ? 'error' : 'warning';
            }
            return 'info';
        };

        const sanitizeOrder = (saved, canonical) => {
            if (!Array.isArray(saved)) return [...canonical];
            const valid = saved.filter(id => canonical.includes(id));
            const missing = canonical.filter(id => !valid.includes(id));
            return [...valid, ...missing];
        };

        const loadData = () => {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (!parsed.lastWeekRecalc) parsed.lastWeekRecalc = null;
                    if (!parsed.banco) parsed.banco = 'ING';
                    if (typeof parsed.presupuestoOriginalMes !== 'number') {
                        parsed.presupuestoOriginalMes = typeof parsed.presupuestoMioMensual === 'number' ? parsed.presupuestoMioMensual : DEFAULT_DATA.presupuestoMioMensual;
                    }
                    if (typeof parsed.gastadoRecalibrado !== 'number') parsed.gastadoRecalibrado = 0;
                    if (!Array.isArray(parsed.reajustes)) parsed.reajustes = [];
                    if (Array.isArray(parsed.expenses)) {
                        const LIMITE_MS = 60 * 24 * 60 * 60 * 1000;
                        const ahora = Date.now();
                        parsed.expenses = parsed.expenses.filter(ex => {
                            if (!ex.deletedAt) return true;
                            return (ahora - new Date(ex.deletedAt).getTime()) < LIMITE_MS;
                        });
                    }
                    parsed.cardOrder = sanitizeOrder(parsed.cardOrder, CARD_IDS);
                    parsed.categoryOrder = sanitizeOrder(parsed.categoryOrder, CATEGORIAS_GASTO);
                    logger.info('Datos cargados correctamente', `(${(parsed.expenses || []).length} gastos)`);
                    return parsed;
                }
                logger.info('No había datos guardados, se usa DEFAULT_DATA');
            } catch (e) {
                logger.error('loadData falló, se usa DEFAULT_DATA', e);
            }
            return JSON.parse(JSON.stringify(DEFAULT_DATA));
        };

        const saveData = (dataToSave) => {
            try { 
                localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave)); 
            } catch (e) {
                logger.error('saveData falló (¿almacenamiento lleno?)', e);
            }
        };

        const loadConcepts = () => {
            try {
                const saved = localStorage.getItem(CONCEPTS_KEY);
                if (!saved) return [];
                const parsed = JSON.parse(saved);
                if (!Array.isArray(parsed)) return [];
                return parsed.filter(c => c && typeof c.name === 'string' && typeof c.lastUsed === 'string');
            } catch (e) {
                logger.error('loadConcepts falló', e);
                return [];
            }
        };

        const saveConcepts = (concepts) => {
            try {
                localStorage.setItem(CONCEPTS_KEY, JSON.stringify(concepts));
            } catch (e) {
                logger.error('saveConcepts falló (¿almacenamiento lleno?)', e);
            }
        };

        const cleanOldConcepts = (concepts) => {
            const LIMITE_MS = CONCEPTS_MAX_AGE_DAYS * 24 * 60 * 60 * 1000;
            const ahora = Date.now();
            return concepts.filter(c => (ahora - new Date(c.lastUsed).getTime()) < LIMITE_MS);
        };

        const sortConceptsByRecency = (concepts) => {
            return [...concepts].sort((a, b) => new Date(b.lastUsed) - new Date(a.lastUsed));
        };

        const registerConceptUsage = (name) => {
            const trimmed = (name || '').trim();
            if (!trimmed) return;
            const now = new Date().toISOString();
            let concepts = cleanOldConcepts(loadConcepts());
            const idx = concepts.findIndex(c => c.name.toLowerCase() === trimmed.toLowerCase());
            if (idx >= 0) {
                concepts[idx] = { name: trimmed, lastUsed: now };
            } else {
                concepts.push({ name: trimmed, lastUsed: now });
            }
            concepts = sortConceptsByRecency(concepts).slice(0, CONCEPTS_MAX);
            saveConcepts(concepts);
            return concepts;
        };

        const getWeekNumber = (date) => {
            const d = new Date(date);
            d.setHours(0,0,0,0);
            d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
            const week1 = new Date(d.getFullYear(), 0, 4);
            return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
        };

        const CICLO_DIAS = 30;

        const getFinancialCycleWeeks = (startDateStr) => {
            const start = startDateStr ? new Date(startDateStr) : new Date(new Date().getFullYear(), new Date().getMonth(), 1);
            start.setHours(0,0,0,0);
            
            const end = new Date(start);
            end.setDate(end.getDate() + (CICLO_DIAS - 1));
            end.setHours(23,59,59,999);

            const getWeekName = (date) => {
                const d = new Date(date);
                d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
                const monthNames = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
                return `Sem. ${Math.ceil(d.getDate() / 7)} (${monthNames[d.getMonth()]})`;
            };

            const weeks = [];
            let current = new Date(start);

            while (current <= end) {
                const sunday = new Date(current);
                const day = sunday.getDay();
                const diff = day === 0 ? 0 : 7 - day;
                sunday.setDate(sunday.getDate() + diff);
                sunday.setHours(23,59,59,999);

                const chunkEnd = sunday > end ? new Date(end) : new Date(sunday);
                const d1 = new Date(current).setHours(0,0,0,0);
                const d2 = new Date(chunkEnd).setHours(0,0,0,0);
                const daysCount = Math.round((d2 - d1) / 86400000) + 1;

                weeks.push({
                    name: getWeekName(current),
                    startChunk: new Date(current),
                    endChunk: new Date(chunkEnd),
                    days: daysCount
                });

                current = new Date(chunkEnd);
                current.setDate(current.getDate() + 1);

            const makeReorderHandlers = ({ refsMap, liveOrder, setLiveOrder, setDragging, dataKey }) => {

                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    const startX = e.clientX, startY = e.clientY;
                    let cancelled = false;

                    const clearWatchers = () => {
                        window.removeEventListener('pointermove', onEarlyMove);
                        window.removeEventListener('pointerup', onEarlyUp);
                    };
                    const onEarlyMove = (ev) => {
                        if (Math.abs(ev.clientX - startX) > MOVE_CANCEL_PX || Math.abs(ev.clientY - startY) > MOVE_CANCEL_PX) {
                            cancelled = true;
                            clearTimeout(timer);
                            clearWatchers();
                        }
                    };
                    const onEarlyUp = () => {
                        cancelled = true;
                        clearTimeout(timer);
                        clearWatchers();
                    };
                    window.addEventListener('pointermove', onEarlyMove);
                    window.addEventListener('pointerup', onEarlyUp, { once: true });

                    const timer = setTimeout(() => {
                        if (cancelled) return;
                        clearWatchers();
                        if (navigator.vibrate) navigator.vibrate(15);
                        setDragging(id);
                        dragInfoRef.current = { id, refsMap, liveOrder: [...liveOrder], setLiveOrder, setDragging, dataKey };
                    }, LONG_PRESS_MS);

                return { onPointerDown };

                    setLiveOrder(prevOrder => {
                        const order = [...prevOrder];
                        const draggedIdx = order.indexOf(id);
                        if (draggedIdx === -1) return prevOrder;
                        for (let i = 0; i < order.length; i++) {
                            if (order[i] === id) continue;

                            const rect = node.getBoundingClientRect();

            const startVoiceRecognition = () => {
                if (!isOnline) {
                    setToast('⚠️ Sin conexión a internet');
                    return;
                }

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    setToast('⚠️ Tu navegador no soporta voz');
                    return;
                }

                if (isListening) {
                    recognitionRef.current?.stop();
                    setIsListening(false);
                    return;
                }

                try {
                    const recognition = new SpeechRecognition();
                    recognitionRef.current = recognition;
                    recognition.lang = 'es-ES';
                    recognition.continuous = false;
                    recognition.interimResults = true;
                    recognition.maxAlternatives = 1;

                    recognition.onstart = () => {
                        setIsListening(true);
                        setToast('🎙️ Escuchando... habla claro');
                    };

                    recognition.onerror = (event) => {
                        setIsListening(false);
                        if (event.error === 'not-allowed') {
                            setToast('⚠️ Permiso de micrófono denegado');
                        } else if (event.error === 'network') {
                            setToast('⚠️ Sin conexión a internet');

                    };

                    recognition.onend = () => {
                        setIsListening(false);

                    recognition.onresult = (event) => {
                        const result = event.results[0];
                        if (!result) return;
                        
                        const transcript = result[0].transcript.trim().toLowerCase();
                        if (!transcript) return;

                        let amount = '';
                        let name = transcript;

                        const match = transcript.match(/(\d+[,.]?\d*)\s*(?:euros?|eur|€)?\s*(.+)/i);
                        const matchReverse = transcript.match(/(.+?)\s*(\d+[,.]?\d*)\s*(?:euros?|eur|€)?/i);

                        if (match) {
                            amount = match[1].replace(',', '.');
                            name = match[2].trim() || transcript;
                        } else if (matchReverse) {
                            amount = matchReverse[2].replace(',', '.');
                            name = matchReverse[1].trim() || transcript;
                        } else {
                            name = transcript;
                        }

                        setFormData(prev => {
                            let autoCategory = prev.category;
                            if (transcript.includes('gasolina')) {
                                autoCategory = 'Gasolina Moto';
                            } else if (transcript.includes('gasoil') || transcript.includes('diésel') || transcript.includes('diesel')) {
                                autoCategory = 'Gasoil Coche';
                            } else if (transcript.includes('combustible')) {
                                autoCategory = 'Combustible';
                            } else if (

            const handleShareExpense = async (exp) => {

                try {

                        textarea.value = texto;

            const SWIPE_ROW_THRESHOLD = 80;   
            const SWIPE_ROW_MAX = 110;        
            const SWIPE_AXIS_LOCK_PX = 10;    

            const [swipeState, setSwipeState] = useState({ id: null, dx: 0 });
            const expenseTouchRef = useRef(null);

            const handleExpenseTouchStart = (exp, e) => {
                if (e.target.closest('button, .drag-handle')) return;
                const t = e.touches[0];
                expenseTouchRef.current = { id: exp.id, startX: t.clientX, startY: t.clientY, active: false, dx: 0 };
            };

            const handleExpenseTouchMove = (exp, e) => {
                const info = expenseTouchRef.current;
                if (!info || info.id !== exp.id) return;
                const t = e.touches[0];
                const dx = t.clientX - info.startX;
                const dy = t.clientY - info.startY;

                if (!info.active) {
                    if (Math.abs(dx) < SWIPE_AXIS_LOCK_PX && Math.abs(dy) < SWIPE_AXIS_LOCK_PX) return;
                    if (Math.abs(dy) > Math.abs(dx)) {
                        expenseTouchRef.current = null;
                        return;
                    }
                    info.active = true;
                }

                const clamped = Math.max(-SWIPE_ROW_MAX, Math.min(SWIPE_ROW_MAX, dx));
                info.dx = clamped;
                setSwipeState({ id: exp.id, dx: clamped });
            };

            const handleExpenseTouchEnd = (exp) => {
                const info = expenseTouchRef.current;
                expenseTouchRef.current = null;
                setSwipeState({ id: null, dx: 0 });
                if (!info || !info.active) return;

                if (info.dx <= -SWIPE_ROW_THRESHOLD) {
                    triggerFeedback('click');
                    handleDelete(exp.id);
                } else if (info.dx >= SWIPE_ROW_THRESHOLD) {
                    triggerFeedback('click');
                    handleOpenEdit(exp);
                }
            };

            const handleExpenseTouchCancel = () => {

            };

            const handleMainTouchEnd = (e) => {
                const start = mainTouchRef.current;
                mainTouchRef.current = null;
                if (!start) return;
                const t = e.changedTouches[0];
                const dx = t.clientX - start.x;
                const dy = t.clientY - start.y;
                if (Math.abs(dy) < SWIPE_GLOBAL_THRESHOLD || Math.abs(dy) < Math.abs(dx) * 1.5) return;

                if (dy > 0) {
                    if (Math.abs(dx) < 30) return;

            const exportSyncSnapshot = (manual = false, isWeekly = false) => {

                setSyncStatus('connecting');

                    expenses: data.expenses,

                };

                syncHandleRef.current = syncWithPC(ip, port, pin, localData, (status, extra) => {

                const prevMap = new Map((data.expenses || []).map(e => [e.id, e]));

                        setData(prev => ({

            // link (handleSyncFromCalculadora), así que hereda su guardia contra
            // reajustes vacíos/duplicados.
            const handleImportCalcFile = (e) => {

                reader.onload = (ev) => {

            const handleEditBanco = () => {

                if (nuevoBanco && nuevoBanco.trim()) {

            };

            const presupuestoSemanal = useMemo(() => {
                const hoy = new Date();
                const cycleStartStr = data.budgetReset?.date || null;
                const activeBase = data.presupuestoMioMensual; 
                const weeks = getFinancialCycleWeeks(cycleStartStr);

                const semanasConDatos = weeks.map((w, idx) => {
                    const expensesInWeek = activeExpenses.filter(e => {
                        const d = new Date(e.fecha).getTime();
                        const startTime = new Date(w.startChunk).setHours(0,0,0,0);
                        const endTime = new Date(w.endChunk).setHours(23,59,59,999);
                        return d >= startTime && d <= endTime;
                    });
                    const totalGastos = expensesInWeek.reduce((acc, e) => acc + parseFloat(e.amount || 0), 0);
                    return { ...w, totalGastos };
                });

                const totalDiasCiclo = semanasConDatos.reduce((acc, w) => acc + w.days, 0);
                const indexActualProvisional = semanasConDatos.findIndex(w =>
                    hoy.getTime() >= new Date(w.startChunk).setHours(0,0,0,0) &&
                    hoy.getTime() <= new Date(w.endChunk).setHours(23,59,59,999)
                );
                const indexActual0 = indexActualProvisional === -1 ? 0 : indexActualProvisional;
                
                // NUEVO: Identificamos cuál es la última semana
                const ultimaSemanaIdx = semanasConDatos.length - 1;

                const gastadoEnSemanasPasadas = semanasConDatos.slice(0, indexActual0).reduce((acc, w) => acc + w.totalGastos, 0);
                const saldoParaRepartir = activeBase - gastadoEnSemanasPasadas;

                // La última semana del ciclo se queda sin presupuesto propio como
                // colchón de seguridad — pero SOLO mientras todavía no ha llegado.
                // En cuanto es la semana actual (ya estás dentro de ella), deja de
                // estar aislada: recibe su reparto como una semana más (en ese
                // punto, al ser la última, se lleva todo lo que quede de saldoParaRepartir).
                const ultimaSemanaAislada = ultimaSemanaIdx !== indexActual0;

                const diasFuturos = semanasConDatos.map((w, idx) => {
                    if (idx >= indexActual0 && !(idx === ultimaSemanaIdx && ultimaSemanaAislada)) return w.days;
                    return 0;
                }).reduce((acc, days) => acc + days, 0);

                const semanasConRollover = semanasConDatos.map((w, idx) => {
                    let presupuestoBase = 0;

                    if (idx < indexActual0) {
                        // Semanas pasadas: cálculo original teórico (solo informativo)
                        presupuestoBase = totalDiasCiclo > 0 ? activeBase * (w.days / totalDiasCiclo) : 0;
                    } else if (idx === ultimaSemanaIdx && ultimaSemanaAislada) {
                        // ÚLTIMA SEMANA AISLADA (aún no ha llegado): 0€ de presupuesto para no compartir saldo
                        presupuestoBase = 0;
                    } else {
                        // Semanas futuras intermedias, o la última semana una vez ya es la actual:
                        // se reparten el saldo restante
                        presupuestoBase = diasFuturos > 0 ? saldoParaRepartir * (w.days / diasFuturos) : 0;
                    }

                    const nuevoRemanente = presupuestoBase - w.totalGastos;
                    return { 
                        ...w, 
                        disponible: presupuestoBase, 
                        nuevoRemanente,
                        presupuestoReal: presupuestoBase
                    };
                });

                let semanaActual = semanasConRollover.find(w => hoy.getTime() >= new Date(w.startChunk).setHours(0,0,0,0) && hoy.getTime() <= new Date(w.endChunk).setHours(23,59,59,999)) || semanasConRollover[0];

                const presupuestoOriginal = typeof data.presupuestoOriginalMes === 'number' ? data.presupuestoOriginalMes : activeBase;
                const totalGastadoCiclo = activeExpenses.reduce((acc, e) => acc + parseFloat(e.amount || 0), 0);
                const restanteTotalMes = presupuestoOriginal - totalGastadoCiclo;
                const porcentajeUsadoMes = presupuestoOriginal > 0 ? Math.min(100, (totalGastadoCiclo / presupuestoOriginal) * 100) : 0;

                const porCategoria = {};
                CATEGORIAS_GASTO.forEach(cat => {
                    porCategoria[cat] = activeExpenses
                        .filter(e => (e.category || 'Otros') === cat)
                        .reduce((acc, e) => acc + parseFloat(e.amount || 0), 0);
                });
                
                const ajustePendiente = data.lastWeekRecalc !== null && data.lastWeekRecalc !== indexActual0;

                const hoyStr = hoy.toISOString().slice(0,10);
                const gastoHoy = activeExpenses
                    .filter(e => e.fecha === hoyStr)
                    .reduce((acc, e) => acc + parseFloat(e.amount || 0), 0);

                const presupuestoRealActual = semanaActual ? semanaActual.presupuestoReal : 0;
                const idealPlanoSemanaActual = (semanaActual && totalDiasCiclo > 0) ? activeBase * (semanaActual.days / totalDiasCiclo) : 0;
                const remanenteAcumulado = presupuestoRealActual - idealPlanoSemanaActual;
                const gastosSemanaActual = semanaActual ? semanaActual.totalGastos : 0;
                const disponibleAhora = presupuestoRealActual - gastosSemanaActual;

                return { 
                    semanas: semanasConRollover, 
                    semanaActual, 
                    disponibleAhora,
                    restanteTotalMes,
                    porcentajeUsadoMes,
                    totalGastadoCiclo,
                    porCategoria,
                    activeBase,
                    ajustePendiente,
                    gastoHoy,
                    presupuestoRealActual,
                    remanenteAcumulado,
                    gastosSemanaActual
                };
            }, [activeExpenses, data.presupuestoMioMensual, data.presupuestoOriginalMes, data.budgetReset, data.lastWeekRecalc]);

            const { 
                semanas, 
                semanaActual, 
                disponibleAhora,
                restanteTotalMes, 
                porcentajeUsadoMes,
                totalGastadoCiclo, 
                porCategoria, 
                activeBase, 
                ajustePendiente, 
                gastoHoy,
                presupuestoRealActual,
                remanenteAcumulado,
                gastosSemanaActual
            } = presupuestoSemanal;

            useEffect(() => {
                let diasRestantesCiclo = null;
                if (data.budgetReset?.date) {
                    const inicio = new Date(data.budgetReset.date);
                    const fin = new Date(inicio);
                    fin.setDate(fin.getDate() + CICLO_DIAS);
                    diasRestantesCiclo = Math.max(0, Math.ceil((fin - new Date()) / (1000 * 60 * 60 * 24)));
                }
                window.BolsilloServices.widget.sync({
                    disponibleAhora: Number((disponibleAhora || 0).toFixed(2)),
                    gastoHoy: Number((gastoHoy || 0).toFixed(2)),
                    restanteTotalMes: Number((restanteTotalMes || 0).toFixed(2)),
                    presupuestoRealActual: Number((presupuestoRealActual || 0).toFixed(2)),
                    gastosSemanaActual: Number((gastosSemanaActual || 0).toFixed(2)),
                    diasRestantesCiclo,
                    actualizadoEn: new Date().toISOString()
                });
            }, [disponibleAhora, gastoHoy, restanteTotalMes, presupuestoRealActual, gastosSemanaActual, data.budgetReset]);

            useEffect(() => {
                const checkNotifications = () => {
                    const fired = loadNotifFired();
                    const now = new Date();
                    let cambiado = false;

                    if (notifSettings.dailyReminderEnabled) {
                        const todayKey = now.toISOString().slice(0, 10);
                        const [h, m] = (notifSettings.dailyReminderTime || '21:00').split(':').map(Number);
                        if (fired.dailyReminder !== todayKey && now.getHours() === h && now.getMinutes() === m) {
                            showAppNotification('📒 Recordatorio diario', '¿Has apuntado todos los gastos de hoy?');
                            fired.dailyReminder = todayKey;
                            cambiado = true;
                        }
                    }

                    if (notifSettings.budgetAlertEnabled && semanaActual && presupuestoRealActual > 0) {
                        const weekKey = new Date(semanaActual.startChunk).toISOString().slice(0, 10);
                        const pct = gastosSemanaActual / presupuestoRealActual;
                        if (pct >= 0.8 && fired.budgetAlert !== weekKey) {
                            showAppNotification('⚠️ Presupuesto semanal', `Ya llevas gastado el ${Math.round(pct * 100)}% de esta semana.`);
                            fired.budgetAlert = weekKey;
                            cambiado = true;
                        }
                    }

                    if (notifSettings.cycleEndAlertEnabled && data.budgetReset?.date) {
                        const inicio = new Date(data.budgetReset.date);
                        const fin = new Date(inicio);
                        fin.setDate(fin.getDate() + CICLO_DIAS);
                        const diasRestantes = Math.ceil((fin - now) / (1000 * 60 * 60 * 24));
                        const cycleKey = data.budgetReset.date;
                        if (diasRestantes >= 0 && diasRestantes <= 3 && fired.cycleEnd !== cycleKey) {
                            showAppNotification('⏳ Fin de ciclo cerca', `Quedan ${diasRestantes} día${diasRestantes === 1 ? '' : 's'} para que termine tu ciclo.`);
                            fired.cycleEnd = cycleKey;
                            cambiado = true;
                        }
                    }

                    if (notifSettings.inactivityAlertEnabled) {
                        const lastActivityStr = localStorage.getItem(LAST_ACTIVITY_KEY);
                        if (lastActivityStr) {
                            const diffDays = (now - new Date(lastActivityStr)) / (1000 * 60 * 60 * 24);
                            const todayKey = now.toISOString().slice(0, 10);
                            if (diffDays >= 3 && fired.inactivity !== todayKey) {
                                showAppNotification('👀 Sin movimiento', 'Llevas 3 días sin registrar ningún gasto.');
                                fired.inactivity = todayKey;
                                cambiado = true;
                            }
                        }
                    }

                    if (cambiado) saveNotifFired(fired);
                };

                checkNotifications();
                const interval = setInterval(checkNotifications, 60000);
                return () => clearInterval(interval);
            }, [notifSettings, semanaActual, presupuestoRealActual, gastosSemanaActual, data.budgetReset]);

            const hoyInicioDia = new Date();
            hoyInicioDia.setHours(0,0,0,0);
            const semanasVisibles = semanas.filter(w => new Date(w.endChunk).getTime() >= hoyInicioDia.getTime());
            let proximaSemanaPreview = null;
            if (semanas.length > 0 && semanasVisibles.length <= 1) {
                const ultima = semanas[semanas.length - 1];
                const inicioPreview = new Date(ultima.endChunk);
                inicioPreview.setDate(inicioPreview.getDate() + 1);
                inicioPreview.setHours(0,0,0,0);
                const finPreview = new Date(inicioPreview);
                finPreview.setDate(finPreview.getDate() + 6);
                proximaSemanaPreview = { startChunk: inicioPreview, endChunk: finPreview };
            }

            const radius = 40;
            const circumference = 2 * Math.PI * radius;
            let accumulatedPercent = 0;

            const donutSlices = CATEGORIAS_GASTO.map(cat => {
                const amount = porCategoria[cat] || 0;
                const percent = totalGastadoCiclo > 0 ? (amount / totalGastadoCiclo) * 100 : 0;
                const strokeVal = (percent / 100) * circumference;
                const dashOffset = -((accumulatedPercent / 100) * circumference);
                accumulatedPercent += percent;
                return {
                    cat,
                    amount,
                    percent,
                    strokeDasharray: `${strokeVal} ${circumference}`,
                    strokeDashoffset: dashOffset,
                    color: COLORES_CATEGORIA[cat]
                };
            });

            const categoryExpenses = useMemo(() => {
                if (!selectedCategoryModal) return { individual: [], comun: [], totalInd: 0, totalCom: 0 };
                const list = activeExpenses.filter(e => (e.category || 'Otros') === selectedCategoryModal);
                const individual = list.filter(e => (e.tipoGasto || 'Individual') === 'Individual');
                const comun = list.filter(e => e.tipoGasto === 'Común');
                const totalInd = individual.reduce((acc, e) => acc + parseFloat(e.amount || 0), 0);
                const totalCom = comun.reduce((acc, e) => acc + parseFloat(e.amount || 0), 0);
                return { individual, comun, totalInd, totalCom };
            }, [activeExpenses, selectedCategoryModal]);

            return (
                <div
                    className="space-y-4 animate-fade"
                    onTouchStart={handleMainTouchStart}
                    onTouchEnd={handleMainTouchEnd}
                    onTouchCancel={() => { mainTouchRef.current = null; }}
                >
                    {toast && (
                        <div className={`toast toast-${getToastLevel(toast)}`}>
                            {toast}
                        </div>
                    )}

                    {!voiceGuideShown && ReactDOM.createPortal(
                        <div className="modal-overlay bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-[#0f111a] border border-white/10 p-8 rounded-[2.5rem] w-full max-w-sm shadow-2xl animate-fade text-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-500"></div>
                                <div className="w-20 h-20 mx-auto bg-indigo-500/10 rounded-full flex items-center justify-center mb-5 border border-indigo-500/20">
                                    <i className="fa-solid fa-microphone text-4xl text-indigo-400"></i>
                                </div>
                                <h3 className="text-xl font-black text-white mb-2">🎙️ Dicta tus gastos</h3>
                                <p className="text-sm text-slate-400 mb-4">Sin escribir, solo habla</p>
                                <div className="bg-black/40 p-4 rounded-2xl border border-white/5 text-left space-y-3 mb-6">
                                    <div className="flex items-center gap-3">
                                        <span className="text-indigo-400 text-sm">💬</span>
                                        <span className="text-slate-300 text-sm">"40 euros zapatos"</span>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="text-indigo-400 text-sm">💬</span>
                                        <span className="text-slate-300 text-sm">"café 2.50"</span>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="text-indigo-400 text-sm">💬</span>
                                        <span className="text-slate-300 text-sm">"15 euros combustible"</span>
                                    </div>
                                </div>
                                <div className="text-xs text-slate-400 space-y-2 text-left mb-6">
                                    <p>📌 Solo tienes que hablar, la app rellena el importe y el concepto</p>
                                    <p>🔄 Puedes corregir el texto antes de guardar</p>
                                    <p>⚡ Necesita conexión a internet</p>
                                </div>
                                <button 
                                    onClick={() => { 
                                        setVoiceGuideShown(true);
                                        localStorage.setItem(VOICE_GUIDE_SHOWN_KEY, 'true');
                                    }} 
                                    className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-sm transition-all shadow-lg active:scale-95"
                                >
                                    ENTENDIDO
                                </button>
                            </div>
                        </div>,
                        document.body
                    )}

                    <div className="flex justify-between items-center bg-white/5 border border-white/10 p-4 rounded-2xl backdrop-blur-md gap-2">
                        <div className="flex items-center gap-2 flex-wrap">
                            <div>
                                <div className="flex items-center gap-3 flex-wrap">
                                    <h1 className="text-lg font-black text-white tracking-tight">Mi Bolsillo</h1>
                                    <span className={`total-hoy text-[12px] font-bold px-2 py-1 rounded-full ${gastoHoy > 0 ? 'bg-rose-500/30 text-rose-400 border border-rose-500/20' : 'bg-white/5 text-slate-400'}`}>
                                        Hoy: {gastoHoy.toFixed(2)}€
                                    </span>
                                    <span 
                                        onClick={handleEditBanco}
                                        className="text-[12px] font-bold text-slate-400 border border-white/5 px-2 py-0.5 rounded-full banco-edit hover:border-indigo-500/50"
                                        title="Haz clic para cambiar el nombre del banco"
                                    >
                                        {data.banco} <i className="fa-solid fa-pen text-[11px] ml-1"></i>
                                    </span>
                                </div>
                                <p className="text-[12px] text-slate-400 uppercase tracking-widest mt-0.5">
                                    {lastSyncAt ? `Sincronizado ${new Date(lastSyncAt).toLocaleTimeString('es', {hour:'2-digit', minute:'2-digit'})}` : 'Sincronizable'}
                                    {' · '}{activeExpenses.length} gastos · {dataSizeKB} KB
                                </p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 flex-wrap justify-end">
                            <button onClick={() => setShowSyncModal(true)} title="Sincronizar por WiFi con El Hilván" className="bg-sky-600 hover:bg-sky-500 text-white px-3.5 py-2 rounded-xl font-bold text-xs shadow-lg active:scale-95 transition-transform flex items-center gap-1.5">
                                <i className="fa-solid fa-wifi"></i>
                            </button>
                            <input type="file" accept="application/json" ref={importInputRef} onChange={handleImportFile} className="hidden" />
                            <button onClick={() => importInputRef.current?.click()} title="Importar gastos de otro móvil sin perder los tuyos" className="bg-white/10 hover:bg-white/20 text-white px-3.5 py-2 rounded-xl font-bold text-xs shadow-lg active:scale-95 transition-transform flex items-center gap-1.5">
                                <i className="fa-solid fa-file-arrow-up"></i>
                            </button>
                            <button onClick={exportMobileJson} title="Copia de seguridad manual" className="bg-indigo-600 text-white px-3.5 py-2 rounded-xl font-bold text-xs shadow-lg active:scale-95 transition-transform flex items-center gap-1.5">
                                <i className="fa-solid fa-file-arrow-down"></i> PC
                            </button>
                            <button onClick={exportCSV} className="bg-emerald-600 text-white px-3.5 py-2 rounded-xl font-bold text-xs shadow-lg active:scale-95 transition-transform flex items-center gap-1.5">
                                <i className="fa-solid fa-file-csv"></i>
                            </button>
                        </div>
                    </div>

                    <div className="flex flex-col gap-4">
                    <div ref={el => cardRefs.current['hero'] = el} style={{ order: liveCardOrder.indexOf('hero') }} className={`transition-transform duration-150 ${draggingCard === 'hero' ? 'scale-[1.02] shadow-2xl relative z-20' : ''}`}>
                        <div onPointerDown={(e) => cardDrag.onPointerDown('hero', e)} className="drag-handle flex justify-center py-1 -mb-1 cursor-grab active:cursor-grabbing touch-none">
                            <i className="fa-solid fa-grip-lines text-slate-600 text-[11px]"></i>
                        </div>
                    <div className="bg-gradient-to-br from-indigo-900/30 to-black/40 border border-indigo-500/20 rounded-3xl p-5 space-y-4">
                        <div className="flex justify-between items-start gap-3">
                            <div className="flex-1">
                                <p className="text-[12px] font-black text-slate-400 uppercase tracking-widest">Puedes gastar ahora</p>
                                <p className={`presupuesto-real ${disponibleAhora >= 0 ? 'text-white' : 'text-rose-400'}`}>
                                    {disponibleAhora >= 0 ? '' : '−'}{Math.abs(disponibleAhora).toFixed(2)}€
                                </p>
                                <p className="text-[12px] text-slate-400 mt-1">
                                    {remanenteAcumulado >= 0 ? `Incluye +${remanenteAcumulado.toFixed(2)}€` : `Incluye ${remanenteAcumulado.toFixed(2)}€`} de semanas anteriores · presupuesto de esta semana {presupuestoRealActual.toFixed(2)}€
                                </p>
                            </div>
                            <button 
                                onClick={handleOpenAdd} 
                                className="btn-add bg-white text-black border border-white/10 px-4 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2 shadow-lg active:scale-95 transition-all shrink-0"
                            >
                                <i className="fa-solid fa-plus"></i> GASTO
                            </button>
                        </div>
                        <div className="h-1.5 w-full bg-black/40 rounded-full overflow-hidden">
                            <div className={`h-full transition-all duration-500 ${gastosSemanaActual > presupuestoRealActual ? 'bg-rose-500' : 'bg-emerald-500'}`} style={{ width: `${presupuestoRealActual > 0 ? Math.min(100, (gastosSemanaActual / presupuestoRealActual) * 100) : 100}%` }}></div>
                        </div>
                        <div className="text-[12px] text-slate-300 flex justify-between items-center">
                            <span>Gastado esta semana</span>
                            <span className="text-rose-400 font-bold text-sm">{gastosSemanaActual.toFixed(2)}€</span>
                        </div>
                    </div>
                    </div>

                    <div ref={el => cardRefs.current['restante'] = el} style={{ order: liveCardOrder.indexOf('restante') }} className={`transition-transform duration-150 ${draggingCard === 'restante' ? 'scale-[1.02] shadow-2xl relative z-20' : ''}`}>
                        <div onPointerDown={(e) => cardDrag.onPointerDown('restante', e)} className="drag-handle flex justify-center py-1 -mb-1 cursor-grab active:cursor-grabbing touch-none">
                            <i className="fa-solid fa-grip-lines text-slate-600 text-[11px]"></i>
                        </div>
                    <div className="bg-white/5 border border-white/10 rounded-3xl p-5">
                        <div className="flex justify-between items-center mb-1">
                            <span className="text-[12px] font-black text-slate-400 uppercase tracking-widest">Restante del mes completo</span>
                            <div className="flex items-center gap-2">
                                <span className="text-[11px] text-slate-400">Base:</span>
                                {!isEditingBase ? (
                                    <button 
                                        onClick={() => { setIsEditingBase(true); setTempBase(data.presupuestoMioMensual); }}
                                        className="text-sm font-bold text-white hover:text-indigo-400 transition-colors flex items-center gap-1"
                                    >
                                        {data.presupuestoMioMensual.toFixed(2)}€
                                        <i className="fa-solid fa-pen text-[11px] text-slate-400"></i>
                                    </button>
                                ) : (
                                    <div className="flex items-center gap-1">
                                        <input 
                                            type="number" 
                                            step="0.01" 
                                            value={tempBase} 
                                            onChange={e => setTempBase(e.target.value)} 
                                            className="w-16 bg-black/50 border border-indigo-500 rounded-lg p-1 text-white font-bold text-xs focus:outline-none"
                                            autoFocus 
                                        />
                                        <button onClick={handleSaveBase} className="bg-emerald-600 text-white px-1.5 py-0.5 rounded font-bold text-[11px]">OK</button>
                                        <button onClick={() => setIsEditingBase(false)} className="bg-slate-700 text-white px-1.5 py-0.5 rounded font-bold text-[11px]">✕</button>
                                    </div>
                                )}
                            </div>
                        </div>
                        <div className="flex justify-between items-end">
                            <p className={`text-3xl font-black ${restanteTotalMes >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                {restanteTotalMes.toFixed(2)}€
                            </p>
                            <p className="text-sm font-bold text-slate-300">{porcentajeUsadoMes.toFixed(0)}% usado</p>
                        </div>
                        <div className="h-1.5 w-full bg-black/40 rounded-full overflow-hidden mt-2">
                            <div className={`h-full transition-all duration-500 ${porcentajeUsadoMes >= 100 ? 'bg-rose-500' : porcentajeUsadoMes >= 80 ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${porcentajeUsadoMes}%` }}></div>
                        </div>
                        <button
                            onClick={handleSincronizarConCalculadora}
                            disabled={sincronizandoConCalc}
                            title="Sincronizar por deep link con la Calculadora de Nómina"
                            className="mt-3 w-full flex items-center justify-center gap-1.5 bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 py-2 rounded-xl font-bold text-[11px] uppercase tracking-wide active:scale-[0.98] transition-all disabled:opacity-60"
                        >
                            <i className={`fa-solid ${sincronizandoConCalc ? 'fa-rotate fa-spin' : 'fa-calculator'}`}></i>
                            {sincronizandoConCalc ? 'Sincronizando...' : 'Sincronizar con la Calculadora'}
                            {!sincronizandoConCalc && ultimaSyncCalc && (
                                <span className="text-slate-500 font-normal normal-case ml-1">
                                    · {new Date(ultimaSyncCalc.at).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' })}
                                </span>
                            )}
                        </button>
                        <input type="file" accept="application/json" ref={importCalcInputRef} onChange={handleImportCalcFile} className="hidden" />
                        <button
                            onClick={() => importCalcInputRef.current?.click()}
                            title="Importar el saldo desde un archivo compartido por la Calculadora de Nómina"
                            className="mt-1.5 w-full flex items-center justify-center gap-1.5 bg-transparent hover:bg-white/5 border border-white/5 text-slate-500 hover:text-slate-300 py-1.5 rounded-xl font-bold text-[10px] uppercase tracking-wide active:scale-[0.98] transition-all"
                        >
                            <i className="fa-solid fa-file-import"></i>
                            Importar de un archivo de la Calculadora
                        </button>
                    </div>
                    </div>

                    <div ref={el => cardRefs.current['ciclo'] = el} style={{ order: liveCardOrder.indexOf('ciclo') }} className={`transition-transform duration-150 ${draggingCard === 'ciclo' ? 'scale-[1.02] shadow-2xl relative z-20' : ''}`}>
                        <div onPointerDown={(e) => cardDrag.onPointerDown('ciclo', e)} className="drag-handle flex justify-center py-1 -mb-1 cursor-grab active:cursor-grabbing touch-none">
                            <i className="fa-solid fa-grip-lines text-slate-600 text-[11px]"></i>
                        </div>
                    <div className="bg-white/5 border border-white/10 rounded-3xl p-5">
                        <div className="flex justify-between items-center mb-3">
                            <div className="flex items-center gap-2">
                                <h2 className="text-sm font-black text-white uppercase tracking-wider">Ciclo de 30 Días</h2>
                                {ajustePendiente && (
                                    <span className="bg-amber-500/20 text-amber-400 text-[11px] font-black px-1.5 py-0.5 rounded-full uppercase tracking-wider animate-pulse">
                                        ↻ Pendiente
                                    </span>
                                )}
                            </div>
                            <div className="flex items-center gap-1.5">
                                <button onClick={() => recalcularBloques(true)} className="text-[11px] text-indigo-400 font-bold border border-indigo-500/20 bg-indigo-500/10 px-2 py-1 rounded-lg active:scale-95 transition-transform">
                                    <i className="fa-solid fa-arrows-rotate mr-1"></i>Recalcular
                                </button>
                                <button onClick={handleResetCycle} className="text-[11px] text-rose-400 font-bold border border-rose-500/20 bg-rose-500/10 px-2 py-1 rounded-lg active:scale-95 transition-transform">
                                    <i className="fa-solid fa-rotate-left mr-1"></i>Reiniciar
                                </button>
                            </div>
                        </div>
                        <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
                            {semanasVisibles.map((w, idx) => {
                                const esActual = semanaActual && w.startChunk.getTime() === semanaActual.startChunk.getTime();
                                const excedida = w.totalGastos > w.presupuestoReal;
                                return (

                                        donutSlices.map((slice, idx) => (
                                            slice.amount > 0 && (
                                                <circle
                                                    key={idx}
                                                    cx="48"
                                                    cy="48"
                                                    r={radius}
                                                    stroke={slice.color}
                                                    strokeWidth="10"
                                                    fill="transparent"
                                                    strokeDasharray={slice.strokeDasharray}

                                        ))

                                </div>
                            </div>
                            
                            <div className="flex flex-col gap-1.5 text-xs">
                                {liveCategoryOrder.map(cat => {
                                    const amount = porCategoria[cat] || 0;
                                    return (
                                        <div 
                                            key={cat} 
                                            ref={el => categoryRefs.current[cat] = el}

                                            <div className="flex items-center gap-1.5 cursor-pointer hover:bg-white/5 rounded-lg flex-1" onClick={() => setSelectedCategoryModal(cat)}>

                                                <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: COLORES_CATEGORIA[cat] }}></span>

                                            </div>
                                            <span className="font-bold text-white cursor-pointer" onClick={() => setSelectedCategoryModal(cat)}>{amount.toFixed(2)}€</span>

                    </div>
                    </div>

                    <div ref={el => cardRefs.current['movimientos'] = el} style={{ order: liveCardOrder.indexOf('movimientos') }} className={`transition-transform duration-150 ${draggingCard === 'movimientos' ? 'scale-[1.02] shadow-2xl relative z-20' : ''}`}>

                        </div>

                            {visibleExpenses.map((exp, idx) => {
                                const isSwiping = swipeState.id === exp.id;
                                const swipeDx = isSwiping ? swipeState.dx : 0;
                                return (
                                <div key={exp.id} className="relative overflow-hidden rounded-xl">
                                    <div
                                        className="absolute inset-0 flex items-center justify-between px-5 rounded-xl pointer-events-none"

                                        <i className={`fa-solid fa-pen text-indigo-300 text-sm transition-opacity ${isSwiping && swipeDx > 24 ? 'opacity-100' : 'opacity-0'}`}></i>
                                        <i className={`fa-solid fa-trash text-rose-300 text-sm transition-opacity ${isSwiping && swipeDx < -24 ? 'opacity-100' : 'opacity-0'}`}></i>
                                    </div>
                                    <div
                                        className={`expense-enter p-3 rounded-xl bg-black/40 border border-white/5 text-xs relative ${idx === 0 ? 'border-indigo-500/30' : ''}`}

                                            animationDelay: `${idx * 0.05}s`,
                                            touchAction: 'pan-y',
                                            transform: `translateX(${swipeDx}px)`,
                                            transition: isSwiping ? 'none' : 'transform 0.2s ease'

                                        onTouchMove={(e) => handleExpenseTouchMove(exp, e)}

                                                <div className="flex items-center gap-2">

                                                    <span className="text-[11px] px-1.5 py-0.5 rounded font-extrabold bg-indigo-500/20 text-indigo-300">
                                                        {emojiCategoria(exp.category)} {exp.category || 'Otros'}
                                                    </span>
                                                    <span className={`text-[11px] px-1.5 py-0.5 rounded font-extrabold ${exp.tipoGasto === 'Común' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-400'}`}>

                                            </div>
                                        </div>
                                    </div>
                                </div>

                                        <i className="fa-solid fa-sliders text-indigo-400"></i> Ajustes

                                                <div>
                                                    <p className="text-sm font-bold text-white">Vibración</p>
                                                    <p className="text-[11px] text-slate-400">Al guardar, eliminar o si hay un error</p>
                                                </div>
                                            </div>
                                            <button
                                                onClick={() => updateFeedbackSettings({ vibrationEnabled: !feedbackSettings.vibrationEnabled })}

                                                <span className="w-5 h-5 bg-white rounded-full shadow"></span>

                                                        <button
                                                            key={opt.id}
                                                            onClick={() => updateFeedbackSettings({ vibrationIntensity: opt.id })}
                                                            className={`py-2 rounded-lg text-xs font-black uppercase tracking-wider transition-all ${feedbackSettings.vibrationIntensity === opt.id ? 'bg-indigo-600 text-white' : 'bg-white/5 text-slate-400 hover:bg-white/10'}`}
                                                        >
                                                            {opt.label}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="flex items-center gap-3">
                                                <i className="fa-solid fa-volume-high text-indigo-400 w-5 text-center"></i>

                                            <button

                                                <span className="w-5 h-5 bg-white rounded-full shadow"></span>
                                            </button>

                                            🔔 Probar feedback

                                            </p>
                                        </div>

                                        <button
                                            onClick={handleManualBackup}

                                            <i className="fa-solid fa-shield-halved"></i> Hacer backup ahora

                                                {backupHistory.map((b, i) => (
                                                    <div key={b.fecha + i} className="flex items-center justify-between bg-white/5 border border-white/10 rounded-lg px-3 py-2">

                                                className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-xs uppercase tracking-widest transition-all flex items-center justify-center gap-2 mb-2.5"

                                                <i className="fa-solid fa-bell"></i>
                                                {notifPermission === 'denied' ? 'Notificaciones bloqueadas por el sistema' : 'Activar notificaciones'}

                                                </div>
                                            </div>

                                                    type="time"
                                                    value={notifSettings.dailyReminderTime}
                                                    onChange={(e) => updateNotifSettings({ dailyReminderTime: e.target.value })}

                                            </div>

                                            >
                                                <span className="w-5 h-5 bg-white rounded-full shadow"></span>

                                        </div>

                                                </div>
                                            </div>
                                            <button
                                                onClick={() => updateNotifSettings({ cycleEndAlertEnabled: !notifSettings.cycleEndAlertEnabled })}

                                                <span className="w-5 h-5 bg-white rounded-full shadow"></span>

                                                </div>
                                            </div>
                                            <button

                                            >
                                                <span className="w-5 h-5 bg-white rounded-full shadow"></span>
                                            </button>
                                        </div>

                                            className="w-full py-3 bg-white/10 hover:bg-white/20 text-white rounded-xl font-bold text-xs uppercase tracking-widest transition-all"
                                        >

                                        </button>

                                            type="submit" 
                                            disabled={showFieldErrors && !isExpenseFormValid(formErrors)}
                                            className={`flex-1 py-3.5 rounded-xl font-black text-sm transition-all shadow-lg active:scale-95 ${showFieldErrors && !isExpenseFormValid(formErrors) ? 'bg-white/10 text-slate-500 cursor-not-allowed shadow-none active:scale-100' : 'bg-indigo-600 hover:bg-indigo-500 text-white'}`}
                                        >
                                            {editingId ? 'ACTUALIZAR' : 'GUARDAR'}
                                        </button>
                                        <button type="button" onClick={handleCloseModal} className="py-3.5 px-4 bg-white/5 hover:bg-white/10 text-slate-400 rounded-xl font-bold text-sm transition-all active:scale-95">
                                            CANCELAR
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>,
                        document.body
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator && !window.Capacitor) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
                try {
                    const { StatusBar } = window.Capacitor.Plugins;
                    StatusBar && StatusBar.setBackgroundColor({ color: '#020205' });
                    StatusBar && StatusBar.setStyle({ style: 'DARK' });
                } catch (e) { }
                try {
                    const { SplashScreen } = window.Capacitor.Plugins;
                    SplashScreen && SplashScreen.hide();
                } catch (e) { }
            }
        });
    </script>
</body>
</html>
