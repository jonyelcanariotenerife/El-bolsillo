        /* Modales */

<body>
    <div id="root" class="max-w-md mx-auto"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const STORAGE_KEY = 'quantum_pocket_mobile_data';
        const VOICE_GUIDE_SHOWN_KEY = 'quantum_voice_guide_shown';
        const THEME_KEY = 'quantum_pocket_theme';
        const LAST_ACTIVITY_KEY = 'quantum_pocket_last_activity';
        const LAST_WEEKLY_BACKUP_KEY = 'quantum_pocket_last_weekly_backup';

        const DEFAULT_DATA = {
            presupuestoMioMensual: 439.12,
            presupuestoOriginalMes: 439.12,
            gastadoRecalibrado: 0,
            budgetReset: null,
            expenses: [],
            lastWeekRecalc: null,
            reajustes: [],
            banco: 'ING',
            cardOrder: ['hero', 'restante', 'ciclo', 'categorias', 'movimientos'],
            categoryOrder: ['Ocio', 'Alimentación', 'Gasolina Moto', 'Gasoil Coche', 'Combustible', 'Casa', 'Otros']
        };

        const CARD_IDS = ['hero', 'restante', 'ciclo', 'categorias', 'movimientos'];

        const CATEGORIAS_GASTO = ['Ocio', 'Alimentación', 'Gasolina Moto', 'Gasoil Coche', 'Combustible', 'Casa', 'Otros'];
        const COLORES_CATEGORIA = {
            'Ocio': '#818cf8',
            'Alimentación': '#34d399',
            'Gasolina Moto': '#06b6d4',
            'Gasoil Coche': '#fbbf24',
            'Combustible': '#a855f7', /* Púrpura elegante para genérico */
            'Casa': '#f43f5e',
            'Otros': '#94a3b8',
            'Transporte': '#fbbf24'
        };

        const sanitizeOrder = (saved, canonical) => {
            if (!Array.isArray(saved)) return [...canonical];
            const valid = saved.filter(id => canonical.includes(id));
            const missing = canonical.filter(id => !valid.includes(id));
            return [...valid, ...missing];
        };

        const loadData = () => {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (!parsed.lastWeekRecalc) parsed.lastWeekRecalc = null;
                    if (!parsed.banco) parsed.banco = 'ING';
                    // Migración: si no existe todavía el presupuesto original del mes (versión
                    // anterior a esta función), se usa el saldo actual como mejor aproximación.
                    if (typeof parsed.presupuestoOriginalMes !== 'number') {
                        parsed.presupuestoOriginalMes = typeof parsed.presupuestoMioMensual === 'number' ? parsed.presupuestoMioMensual : DEFAULT_DATA.presupuestoMioMensual;
                    }
                    if (typeof parsed.gastadoRecalibrado !== 'number') parsed.gastadoRecalibrado = 0;
                    if (!Array.isArray(parsed.reajustes)) parsed.reajustes = [];
                    parsed.cardOrder = sanitizeOrder(parsed.cardOrder, CARD_IDS);
                    parsed.categoryOrder = sanitizeOrder(parsed.categoryOrder, CATEGORIAS_GASTO);
                    return parsed;
                }
            } catch (e) {}
            return JSON.parse(JSON.stringify(DEFAULT_DATA));
        };

        const saveData = (dataToSave) => {
            try { 
                localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave)); 
            } catch (e) {}
        };

        const getWeekNumber = (date) => {
            const d = new Date(date);
            d.setHours(0,0,0,0);
            d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
            const week1 = new Date(d.getFullYear(), 0, 4);
            return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
        };

        const CICLO_DIAS = 28;

        const getFinancialCycleWeeks = (startDateStr) => {
            const start = startDateStr ? new Date(startDateStr) : new Date(new Date().getFullYear(), new Date().getMonth(), 1);
            start.setHours(0,0,0,0);
            
            const end = new Date(start);
            end.setDate(end.getDate() + (CICLO_DIAS - 1));
            end.setHours(23,59,59,999);

            const getWeekName = (date) => {
                const d = new Date(date);
                d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
                const monthNames = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
                return `Sem. ${Math.ceil(d.getDate() / 7)} (${monthNames[d.getMonth()]})`;
            };

            const weeks = [];
            let current = new Date(start);

            while (current <= end) {
                const sunday = new Date(current);
                const day = sunday.getDay();
                const diff = day === 0 ? 0 : 7 - day;
                sunday.setDate(sunday.getDate() + diff);
                sunday.setHours(23,59,59,999);

                const chunkEnd = sunday > end ? new Date(end) : new Date(sunday);
                const d1 = new Date(current).setHours(0,0,0,0);
                const d2 = new Date(chunkEnd).setHours(0,0,0,0);
                const daysCount = Math.round((d2 - d1) / 86400000) + 1;

                weeks.push({
                    name: getWeekName(current),
                    startChunk: new Date(current),
                    endChunk: new Date(chunkEnd),
                    days: daysCount
                });

                current = new Date(chunkEnd);
                current.setDate(current.getDate() + 1);
                current.setHours(0,0,0,0);
            }
            return weeks;
        };

        const formatFechaAmigable = (fechaStr) => {
            const hoy = new Date();
            const ayer = new Date(hoy);
            ayer.setDate(ayer.getDate() - 1);
            
            const fecha = new Date(fechaStr);
            fecha.setHours(0,0,0,0);
            hoy.setHours(0,0,0,0);
            ayer.setHours(0,0,0,0);

            if (fecha.getTime() === hoy.getTime()) return 'Hoy';
            if (fecha.getTime() === ayer.getTime()) return 'Ayer';
            
            const diffDias = Math.floor((hoy.getTime() - fecha.getTime()) / 86400000);
            if (diffDias < 7) {
                const diasSemana = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
                return diasSemana[fecha.getDay()];
            }
            
            return `${fecha.getDate()} ${fecha.toLocaleString('es', { month: 'short' })}`;
        };

        const App = () => {
            const [data, setData] = useState(() => loadData());
            const [modalOpen, setModalOpen] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [formData, setFormData] = useState({ 
                name: '', 
                amount: '', 
                category: 'Ocio', 
                tipoGasto: 'Individual', 
                fecha: new Date().toISOString().slice(0,10) 
            });
            const [hasChanges, setHasChanges] = useState(false);

            const [isEditingBase, setIsEditingBase] = useState(false);
            const [tempBase, setTempBase] = useState(data.presupuestoMioMensual);
            const [toast, setToast] = useState(null);
            const [selectedCategoryModal, setSelectedCategoryModal] = useState(null);
            const [showCreator, setShowCreator] = useState(false);
            const [showGuide, setShowGuide] = useState(false);
            const [guideTab, setGuideTab] = useState('ciclo');
            
            const [isListening, setIsListening] = useState(false);
            const [voiceGuideShown, setVoiceGuideShown] = useState(() => {
                return localStorage.getItem(VOICE_GUIDE_SHOWN_KEY) === 'true';
            });
            const [isOnline, setIsOnline] = useState(navigator.onLine);

            const [theme, setTheme] = useState(() => {
                const saved = localStorage.getItem(THEME_KEY);
                return saved || 'dark';
            });

            useEffect(() => {
                if (theme === 'light') {
                    document.body.classList.add('light-mode');
                } else {
                    document.body.classList.remove('light-mode');
                }
                localStorage.setItem(THEME_KEY, theme);
            }, [theme]);

            useEffect(() => {
                const lastActivity = localStorage.getItem(LAST_ACTIVITY_KEY);
                if (lastActivity) {
                    const diff = Date.now() - new Date(lastActivity).getTime();
                    const hours = diff / (1000 * 60 * 60);
                    if (hours > 24 && data.expenses.length > 0) {
                        setToast('🔔 ¿Has hecho algún gasto hoy? ¡Apúntalo!');
                    }
                }
                localStorage.setItem(LAST_ACTIVITY_KEY, new Date().toISOString());
            }, []);

            const updateLastActivity = () => {
                localStorage.setItem(LAST_ACTIVITY_KEY, new Date().toISOString());
            };

            const recognitionRef = useRef(null);
            const inputRef = useRef(null);
            const importInputRef = useRef(null);
            const hasHydrated = useRef(false);
            const [lastSyncAt, setLastSyncAt] = useState(null);

            const cardRefs = useRef({});
            const categoryRefs = useRef({});
            const [draggingCard, setDraggingCard] = useState(null);
            const [liveCardOrder, setLiveCardOrder] = useState(data.cardOrder);
            const [draggingCategory, setDraggingCategory] = useState(null);
            const [liveCategoryOrder, setLiveCategoryOrder] = useState(data.categoryOrder);
            const dragInfoRef = useRef(null);

            const LONG_PRESS_MS = 400;
            const MOVE_CANCEL_PX = 8;

            const makeReorderHandlers = ({ refsMap, liveOrder, setLiveOrder, setDragging, dataKey }) => {
                const onPointerDown = (id, e) => {
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    const startX = e.clientX, startY = e.clientY;
                    let cancelled = false;

                    const clearWatchers = () => {
                        window.removeEventListener('pointermove', onEarlyMove);
                        window.removeEventListener('pointerup', onEarlyUp);
                    };
                    const onEarlyMove = (ev) => {
                        if (Math.abs(ev.clientX - startX) > MOVE_CANCEL_PX || Math.abs(ev.clientY - startY) > MOVE_CANCEL_PX) {
                            cancelled = true;
                            clearTimeout(timer);
                            clearWatchers();
                        }
                    };
                    const onEarlyUp = () => {
                        cancelled = true;
                        clearTimeout(timer);
                        clearWatchers();
                    };
                    window.addEventListener('pointermove', onEarlyMove);
                    window.addEventListener('pointerup', onEarlyUp, { once: true });

                    const timer = setTimeout(() => {
                        if (cancelled) return;
                        clearWatchers();
                        if (navigator.vibrate) navigator.vibrate(15);
                        setDragging(id);
                        dragInfoRef.current = { id, refsMap, liveOrder: [...liveOrder], setLiveOrder, setDragging, dataKey };
                    }, LONG_PRESS_MS);
                };
                return { onPointerDown };
            };

            const cardDrag = makeReorderHandlers({
                refsMap: cardRefs, liveOrder: liveCardOrder, setLiveOrder: setLiveCardOrder,
                setDragging: setDraggingCard, dataKey: 'cardOrder'
            });
            const categoryDrag = makeReorderHandlers({
                refsMap: categoryRefs, liveOrder: liveCategoryOrder, setLiveOrder: setLiveCategoryOrder,
                setDragging: setDraggingCategory, dataKey: 'categoryOrder'
            });

            useEffect(() => {
                const info = dragInfoRef.current;
                if (!info) return;

                const onMove = (e) => {
                    const { id, refsMap, setLiveOrder } = dragInfoRef.current;
                    const y = e.clientY;
                    setLiveOrder(prevOrder => {
                        const order = [...prevOrder];
                        const draggedIdx = order.indexOf(id);
                        if (draggedIdx === -1) return prevOrder;
                        for (let i = 0; i < order.length; i++) {
                            if (order[i] === id) continue;
                            const node = refsMap.current[order[i]];
                            if (!node) continue;
                            const rect = node.getBoundingClientRect();
                            const mid = rect.top + rect.height / 2;
                            const targetIdx = order.indexOf(order[i]);
                            if ((draggedIdx < targetIdx && y > mid) || (draggedIdx > targetIdx && y < mid)) {
                                const [moved] = order.splice(draggedIdx, 1);
                                order.splice(targetIdx, 0, moved);
                                return order;
                            }
                        }
                        return prevOrder;
                    });
                };

                const onUp = () => {
                    const { setLiveOrder, setDragging, dataKey } = dragInfoRef.current;
                    setLiveOrder(finalOrder => {
                        setData(prev => ({ ...prev, [dataKey]: finalOrder }));
                        return finalOrder;
                    });
                    setDragging(null);
                    dragInfoRef.current = null;
                };

                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp, { once: true });
                return () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                };
            }, [draggingCard, draggingCategory]);

            useEffect(() => {
                const handleOnline = () => setIsOnline(true);
                const handleOffline = () => setIsOnline(false);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                        e.preventDefault();
                        if (!modalOpen) handleOpenAdd();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [modalOpen]);

            useEffect(() => {
                if (modalOpen) {
                    const hasName = formData.name.trim().length > 0;
                    const hasAmount = formData.amount && parseFloat(formData.amount) > 0;
                    setHasChanges(hasName || hasAmount);
                } else {
                    setHasChanges(false);
                }
            }, [formData, modalOpen]);

            useEffect(() => {
                if (toast) {
                    const timer = setTimeout(() => setToast(null), 4000);
                    return () => clearTimeout(timer);
                }
            }, [toast]);

            useEffect(() => {
                saveData(data);
            }, [data]);

            // Recalcula el saldo restante descontando SOLO lo gastado desde la última vez que se
            // recalculó (no todo lo del ciclo otra vez), y solo cuando cambia la semana de TU
            // ciclo de 28 días (no la semana natural del calendario). Deja siempre un registro
            // en "reajustes" con lo que pasó, para poder mirar atrás.
            const recalcularBloques = (manual = false) => {
                const resetDate = data.budgetReset?.date;
                if (!resetDate) {
                    if (manual) setToast('⚠️ Primero reinicia el ciclo');
                    return false;
                }

                const hoy = new Date();
                const weeks = getFinancialCycleWeeks(resetDate);
                const idxEncontrado = weeks.findIndex(w =>
                    hoy.getTime() >= new Date(w.startChunk).setHours(0,0,0,0) &&
                    hoy.getTime() <= new Date(w.endChunk).setHours(23,59,59,999)
                );
                const semanaActualIdx = idxEncontrado === -1 ? weeks.length - 1 : idxEncontrado;
                const ultimaSemanaRecalc = data.lastWeekRecalc;

                if (ultimaSemanaRecalc === semanaActualIdx && !manual) {
                    return false;
                }

                const totalGastado = data.expenses.reduce((acc, e) => acc + parseFloat(e.amount || 0), 0);
                const gastadoRecalibradoPrev = data.gastadoRecalibrado || 0;
                const gastadoNuevo = Math.max(0, totalGastado - gastadoRecalibradoPrev);

                if (gastadoNuevo <= 0) {
                    setData(prev => ({ ...prev, lastWeekRecalc: semanaActualIdx }));
                    if (manual) setToast('ℹ️ No hay gasto nuevo que recalcular');
                    return false;
                }

                const saldoAntes = data.presupuestoMioMensual;
                const saldoDespues = Math.max(0, saldoAntes - gastadoNuevo);

                const nuevoReajuste = {
                    fecha: hoy.toISOString(),
                    saldoAntes,
                    saldoDespues,
                    gastadoDesdeUltimoRecalculo: gastadoNuevo,
                    gastadoTotalCiclo: totalGastado,
                    motivo: manual ? 'Recálculo manual' : 'Cambio de semana'
                };

                setData(prev => ({
                    ...prev,
                    presupuestoMioMensual: saldoDespues,
                    gastadoRecalibrado: totalGastado,
                    lastWeekRecalc: semanaActualIdx,
                    reajustes: [...(prev.reajustes || []), nuevoReajuste].slice(-30)
                }));

                if (manual) setToast(`✅ Recalculado: -${gastadoNuevo.toFixed(2)}€`);
                return true;
            };

            useEffect(() => {
                if (data.budgetReset?.date) {
                    const timer = setTimeout(() => {
                        recalcularBloques(false);
                    }, 500);
                    return () => clearTimeout(timer);
                }
            }, [data.budgetReset?.date]);

            const handleResetCycle = () => {
                if (data.expenses.length === 0) {
                    if (!window.confirm('¿Reiniciar ciclo sin gastos?')) return;
                } else {
                    if (!window.confirm('¿Reiniciar ciclo? Se generará un backup de los gastos actuales.')) return;
                }

                const hoy = new Date();
                const totalGastadoCicloAnterior = data.expenses.reduce((acc, e) => acc + parseFloat(e.amount || 0), 0);

                if (data.expenses.length > 0) {
                    const mesActual = hoy.toLocaleString('es', { month: 'long', year: 'numeric' });
                    const fileName = `cierre_ciclo_${mesActual.replace(/ /g, '_')}.json`;
                    
                    const backupData = {
                        fechaBackup: hoy.toISOString(),
                        presupuestoOriginalMes: data.presupuestoOriginalMes,
                        presupuestoMioMensual: data.presupuestoMioMensual,
                        budgetReset: data.budgetReset,
                        expenses: data.expenses
                    };

                    const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    a.click();
                    URL.revokeObjectURL(url);
                    setToast(`📁 Backup: ${fileName}`);
                }

                // Se deja constancia del cierre del ciclo anterior antes de perder sus gastos:
                // cuánto quedaba del presupuesto original y cuánto se había gastado en total.
                const cierreReajuste = {
                    fecha: hoy.toISOString(),
                    saldoAntes: data.presupuestoMioMensual,
                    saldoDespues: data.presupuestoMioMensual,
                    gastadoDesdeUltimoRecalculo: 0,
                    gastadoTotalCiclo: totalGastadoCicloAnterior,
                    motivo: `Reinicio de ciclo (presupuesto original era ${(data.presupuestoOriginalMes ?? data.presupuestoMioMensual).toFixed(2)}€)`
                };

                const newData = {
                    ...data,
                    budgetReset: {
                        date: hoy.toISOString(),
                        base: data.presupuestoMioMensual
                    },
                    expenses: [],
                    presupuestoOriginalMes: data.presupuestoMioMensual,
                    gastadoRecalibrado: 0,
                    lastWeekRecalc: 0,
                    reajustes: [...(data.reajustes || []), cierreReajuste].slice(-30)
                };
                setData(newData);
                setToast('✅ Ciclo reiniciado');
                updateLastActivity();
            };

            const startVoiceRecognition = () => {
                if (!isOnline) {
                    setToast('⚠️ Sin conexión a internet');
                    return;
                }

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    setToast('⚠️ Tu navegador no soporta voz');
                    return;
                }

                if (isListening) {
                    recognitionRef.current?.stop();
                    setIsListening(false);
                    return;
                }

                try {
                    const recognition = new SpeechRecognition();
                    recognitionRef.current = recognition;
                    recognition.lang = 'es-ES';
                    recognition.continuous = false;
                    recognition.interimResults = true;
                    recognition.maxAlternatives = 1;

                    recognition.onstart = () => {
                        setIsListening(true);
                        setToast('🎙️ Escuchando... habla claro');
                    };

                    recognition.onerror = (event) => {
                        setIsListening(false);
                        if (event.error === 'not-allowed') {
                            setToast('⚠️ Permiso de micrófono denegado');
                        } else if (event.error === 'network') {
                            setToast('⚠️ Sin conexión a internet');
                        } else {
                            setToast('⚠️ Error: ' + event.error);
                        }
                    };

                    recognition.onend = () => {
                        setIsListening(false);
                        setToast(null);
                    };

                    recognition.onresult = (event) => {
                        const result = event.results[0];
                        if (!result) return;
                        
                        const transcript = result[0].transcript.trim().toLowerCase();
                        if (!transcript) return;

                        let amount = '';
                        let name = transcript;

                        const match = transcript.match(/(\d+[,.]?\d*)\s*(?:euros?|eur|€)?\s*(.+)/i);
                        const matchReverse = transcript.match(/(.+?)\s*(\d+[,.]?\d*)\s*(?:euros?|eur|€)?/i);

                        if (match) {
                            amount = match[1].replace(',', '.');
                            name = match[2].trim() || transcript;
                        } else if (matchReverse) {
                            amount = matchReverse[2].replace(',', '.');
                            name = matchReverse[1].trim() || transcript;
                        } else {
                            name = transcript;
                        }

                        setFormData(prev => {
                            let autoCategory = prev.category;
                            if (transcript.includes('gasolina')) {
                                autoCategory = 'Gasolina Moto';
                            } else if (transcript.includes('gasoil') || transcript.includes('diésel') || transcript.includes('diesel')) {
                                autoCategory = 'Gasoil Coche';
                            } else if (transcript.includes('combustible')) {
                                autoCategory = 'Combustible';
                            }
                            
                            return {
                                ...prev,
                                name: name.charAt(0).toUpperCase() + name.slice(1),
                                amount: amount || prev.amount,
                                category: autoCategory
                            };
                        });

                        if (amount && name.length > 1) {
                            setTimeout(() => {
                                recognitionRef.current?.stop();
                                setIsListening(false);
                                setToast('✅ ¡Gasto reconocido! Revisa y guarda');
                            }, 500);
                        }
                    };

                    recognition.start();
                } catch (error) {
                    setIsListening(false);
                    setToast('⚠️ Error al iniciar el micrófono');
                }
            };

            const handleCloseModal = () => {
                if (hasChanges) {
                    if (!window.confirm('Tienes cambios sin guardar. ¿Quieres salir?')) return;
                }
                setModalOpen(false);
                setEditingId(null);
                setFormData({ name: '', amount: '', category: 'Ocio', tipoGasto: 'Individual', fecha: new Date().toISOString().slice(0,10) });
                setHasChanges(false);
            };

            const handleOpenAdd = () => {
                setEditingId(null);
                setFormData({ name: '', amount: '', category: 'Ocio', tipoGasto: 'Individual', fecha: new Date().toISOString().slice(0,10) });
                setHasChanges(false);
                setModalOpen(true);
                setTimeout(() => inputRef.current?.focus(), 100);
            };

            const handleOpenEdit = (exp) => {
                setEditingId(exp.id);
                setFormData({ 
                    name: exp.name, 
                    amount: exp.amount, 
                    category: exp.category || 'Otros', 
                    tipoGasto: exp.tipoGasto || 'Individual', 
                    fecha: exp.fecha 
                });
                setHasChanges(true);
                setModalOpen(true);
                setTimeout(() => inputRef.current?.focus(), 100);
            };

            const handleSaveExpense = (e) => {
                e.preventDefault();
                if (!formData.name.trim() || !formData.amount) return alert('Rellena nombre e importe');
                
                if (editingId) {
                    setData(prev => ({
                        ...prev,
                        expenses: prev.expenses.map(ex => ex.id === editingId ? { ...ex, ...formData, amount: parseFloat(formData.amount) } : ex)
                    }));
                    setToast('✅ Gasto actualizado');
                } else {
                    const newExp = {
                        id: Date.now(),
                        name: formData.name,
                        amount: parseFloat(formData.amount),
                        category: formData.category,
                        tipoGasto: formData.tipoGasto,
                        fecha: formData.fecha,
                        presupuestoMio: true
                    };
                    setData(prev => ({ ...prev, expenses: [newExp, ...prev.expenses] }));
                    setToast('✅ Gasto guardado');
                }

                setModalOpen(false);
                setEditingId(null);
                setFormData({ name: '', amount: '', category: 'Ocio', tipoGasto: 'Individual', fecha: new Date().toISOString().slice(0,10) });
                setHasChanges(false);
                updateLastActivity();
                setTimeout(() => recalcularBloques(false), 300);
            };

            const handleDelete = (id) => {
                if (window.confirm('¿Borrar este gasto?')) {
                    setData(prev => ({ ...prev, expenses: prev.expenses.filter(ex => ex.id !== id) }));
                    setToast('🗑️ Gasto eliminado');
                    updateLastActivity();
                    setTimeout(() => recalcularBloques(false), 300);
                }
            };

            const handleSaveBase = () => {
                const val = parseFloat(tempBase);
                if (!isNaN(val) && val >= 0) {
                    const cicloRecienEmpezado = data.expenses.length === 0;
                    const nuevoReajuste = {
                        fecha: new Date().toISOString(),
                        saldoAntes: data.presupuestoMioMensual,
                        saldoDespues: val,
                        gastadoDesdeUltimoRecalculo: 0,
                        gastadoTotalCiclo: 0,
                        motivo: 'Edición manual del saldo'
                    };
                    setData(prev => ({
                        ...prev,
                        presupuestoMioMensual: val,
                        // Si el ciclo todavía no tiene gastos, este número ES el presupuesto
                        // original del mes; si ya llevas gastos, es solo un ajuste de reparto
                        // y el original no se toca (para que "restante del mes" siga siendo real).
                        ...(cicloRecienEmpezado ? { presupuestoOriginalMes: val } : {}),
                        reajustes: [...(prev.reajustes || []), nuevoReajuste].slice(-30)
                    }));
                    setIsEditingBase(false);
                    setToast('✅ Presupuesto actualizado');
                } else {
                    alert('Introduce un importe válido');
                }
            };

            const exportSyncSnapshot = (manual = false, isWeekly = false) => {
                const now = new Date();
                const stamp = now.toISOString().replace(/[:.]/g, '-').slice(0, 19);
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                
                if (isWeekly) {
                    a.download = `bolsillo_backup_semanal_${stamp}.json`;
                    localStorage.setItem(LAST_WEEKLY_BACKUP_KEY, now.toISOString());
                    setToast('🛡️ Copia de seguridad semanal automática guardada');
                } else {
                    a.download = `bolsillo_sync_${stamp}.json`;
                    if (manual) setToast('📤 Sincronizado a Descargas');
                }
                
                a.click();
                URL.revokeObjectURL(url);
                setLastSyncAt(now.toISOString());
            };

            const exportMobileJson = () => exportSyncSnapshot(true, false);

            useEffect(() => {
                if (!hasHydrated.current) { 
                    hasHydrated.current = true; 
                    const lastBackupStr = localStorage.getItem(LAST_WEEKLY_BACKUP_KEY);
                    
                    if (!lastBackupStr) {
                        localStorage.setItem(LAST_WEEKLY_BACKUP_KEY, new Date().toISOString());
                    } else {
                        const diffDays = (new Date() - new Date(lastBackupStr)) / (1000 * 60 * 60 * 24);
                        if (diffDays >= 7 && data.expenses.length > 0) {
                            setTimeout(() => exportSyncSnapshot(false, true), 2000);
                        }
                    }
                }
            }, [data.expenses.length]);

            const handleImportFile = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const incoming = JSON.parse(ev.target.result);
                        const incomingExpenses = Array.isArray(incoming.expenses) ? incoming.expenses : [];
                        if (incomingExpenses.length === 0) {
                            setToast('⚠️ El archivo no tiene gastos');
                            return;
                        }
                        const existingIds = new Set(data.expenses.map(ex => ex.id));
                        const nuevos = incomingExpenses.filter(ex => !existingIds.has(ex.id));
                        if (nuevos.length === 0) {
                            setToast('ℹ️ No hay gastos nuevos que importar');
                            return;
                        }
                        setData(prev => ({
                            ...prev,
                            expenses: [...nuevos, ...prev.expenses].sort((a, b) => new Date(b.fecha) - new Date(a.fecha) || b.id - a.id)
                        }));
                        setToast(`✅ ${nuevos.length} gasto${nuevos.length > 1 ? 's' : ''} importado${nuevos.length > 1 ? 's' : ''} · tus datos actuales no se han tocado`);
                        updateLastActivity();
                        setTimeout(() => recalcularBloques(false), 300);
                    } catch (err) {
                        setToast('⚠️ Archivo no válido');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const exportCSV = () => {
                if (data.expenses.length === 0) {
                    setToast('⚠️ No hay gastos para exportar');
                    return;
                }
                let csv = "Fecha,Concepto,Importe,Categoria,Ambito\n";
                data.expenses.forEach(e => {
                    csv += `${e.fecha},${e.name},${e.amount},${e.category || 'Otros'},${e.tipoGasto || 'Individual'}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `gastos_${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
                URL.revokeObjectURL(url);
                setToast('📤 CSV exportado!');
            };

            const handleEditBanco = () => {
                const nuevoBanco = prompt('Nombre del banco:', data.banco);
                if (nuevoBanco && nuevoBanco.trim()) {
                    setData(prev => ({ ...prev, banco: nuevoBanco.trim() }));
                    setToast('✅ Banco actualizado');
                }
            };

            const toggleTheme = () => {
                setTheme(prev => prev === 'dark' ? 'light' : 'dark');
            };

            const presupuestoSemanal = useMemo(() => {
                const hoy = new Date();
                const cycleStartStr = data.budgetReset?.date || null;
                const activeBase = data.presupuestoMioMensual; 
                const weeks = getFinancialCycleWeeks(cycleStartStr);

                const semanasConDatos = weeks.map((w, idx) => {
                    const expensesInWeek = data.expenses.filter(e => {
                        const d = new Date(e.fecha).getTime();
                        const startTime = new Date(w.startChunk).setHours(0,0,0,0);
                        const endTime = new Date(w.endChunk).setHours(23,59,59,999);
                        return d >= startTime && d <= endTime;
                    });
                    const totalGastos = expensesInWeek.reduce((acc, e) => acc + parseFloat(e.amount || 0), 0);
                    return { ...w, totalGastos };
                });

                // REAJUSTE: reparto plano. Las semanas YA CERRADAS (antes de hoy) se muestran con
                // su reparto ideal original, solo a título informativo — no se recalculan. Lo que
                // de verdad importa es la semana actual y las que quedan: se coge el saldo REAL que
                // queda del ciclo (presupuesto total menos lo ya gastado en semanas pasadas) y se
                // reparte de forma proporcional a los días entre la semana actual y las futuras, en
                // un único cálculo (no en cascada), así nunca puede sumar más del dinero que
                // realmente tienes.
                const totalDiasCiclo = semanasConDatos.reduce((acc, w) => acc + w.days, 0);
                const indexActualProvisional = semanasConDatos.findIndex(w =>
                    hoy.getTime() >= new Date(w.startChunk).setHours(0,0,0,0) &&
                    hoy.getTime() <= new Date(w.endChunk).setHours(23,59,59,999)
                );
                const indexActual0 = indexActualProvisional === -1 ? 0 : indexActualProvisional;
                const gastadoEnSemanasPasadas = semanasConDatos.slice(0, indexActual0).reduce((acc, w) => acc + w.totalGastos, 0);
                const diasFuturos = semanasConDatos.slice(indexActual0).reduce((acc, w) => acc + w.days, 0);
                const saldoParaRepartir = activeBase - gastadoEnSemanasPasadas;

                const semanasConRollover = semanasConDatos.map((w, idx) => {
                    const presupuestoBase = idx < indexActual0
                        ? (totalDiasCiclo > 0 ? activeBase * (w.days / totalDiasCiclo) : 0)
                        : (diasFuturos > 0 ? saldoParaRepartir * (w.days / diasFuturos) : 0);
                    const nuevoRemanente = presupuestoBase - w.totalGastos;
                    return { 
                        ...w, 
                        disponible: presupuestoBase, 
                        nuevoRemanente,
                        presupuestoReal: presupuestoBase
                    };
                });

                let semanaActual = semanasConRollover.find(w => hoy.getTime() >= new Date(w.startChunk).setHours(0,0,0,0) && hoy.getTime() <= new Date(w.endChunk).setHours(23,59,59,999)) || semanasConRollover[0];

                const presupuestoOriginal = typeof data.presupuestoOriginalMes === 'number' ? data.presupuestoOriginalMes : activeBase;
                const totalGastadoCiclo = data.expenses.reduce((acc, e) => acc + parseFloat(e.amount || 0), 0);
                const restanteTotalMes = presupuestoOriginal - totalGastadoCiclo;
                const porcentajeUsadoMes = presupuestoOriginal > 0 ? Math.min(100, (totalGastadoCiclo / presupuestoOriginal) * 100) : 0;

                const porCategoria = {};
                CATEGORIAS_GASTO.forEach(cat => {
                    porCategoria[cat] = data.expenses
                        .filter(e => (e.category || 'Otros') === cat)
                        .reduce((acc, e) => acc + parseFloat(e.amount || 0), 0);
                });
                
                const ajustePendiente = data.lastWeekRecalc !== null && data.lastWeekRecalc !== indexActual0;

                const hoyStr = hoy.toISOString().slice(0,10);
                const gastoHoy = data.expenses
                    .filter(e => e.fecha === hoyStr)
                    .reduce((acc, e) => acc + parseFloat(e.amount || 0), 0);

                const presupuestoRealActual = semanaActual ? semanaActual.presupuestoReal : 0;
                const idealPlanoSemanaActual = (semanaActual && totalDiasCiclo > 0) ? activeBase * (semanaActual.days / totalDiasCiclo) : 0;
                const remanenteAcumulado = presupuestoRealActual - idealPlanoSemanaActual;
                const gastosSemanaActual = semanaActual ? semanaActual.totalGastos : 0;
                const disponibleAhora = presupuestoRealActual - gastosSemanaActual;

                return { 
                    semanas: semanasConRollover, 
                    semanaActual, 
                    disponibleAhora,
                    restanteTotalMes,
                    porcentajeUsadoMes,
                    totalGastadoCiclo,
                    porCategoria,
                    activeBase,
                    ajustePendiente,
                    gastoHoy,
                    presupuestoRealActual,
                    remanenteAcumulado,
                    gastosSemanaActual
                };
            }, [data.expenses, data.presupuestoMioMensual, data.presupuestoOriginalMes, data.budgetReset, data.lastWeekRecalc]);

            const { 
                semanas, 
                semanaActual, 
                disponibleAhora,
                restanteTotalMes, 
                porcentajeUsadoMes,
                totalGastadoCiclo, 
                porCategoria, 
                activeBase, 
                ajustePendiente, 
                gastoHoy,
                presupuestoRealActual,
                remanenteAcumulado,
                gastosSemanaActual
            } = presupuestoSemanal;

            // Semanas a mostrar en la tarjeta "Ciclo de 30 Días": se ocultan las que ya han
            // terminado (siguen existiendo por debajo para el rollover, solo no se pintan).
            // Si no queda ninguna semana futura del ciclo, se añade una tarjeta de "propina"
            // con la semana natural siguiente, solo de fecha, que no cuenta para nada.
            const hoyInicioDia = new Date();
            hoyInicioDia.setHours(0,0,0,0);
            const semanasVisibles = semanas.filter(w => new Date(w.endChunk).getTime() >= hoyInicioDia.getTime());
            let proximaSemanaPreview = null;
            if (semanas.length > 0 && semanasVisibles.length <= 1) {
                const ultima = semanas[semanas.length - 1];
                const inicioPreview = new Date(ultima.endChunk);
                inicioPreview.setDate(inicioPreview.getDate() + 1);
                inicioPreview.setHours(0,0,0,0);
                const finPreview = new Date(inicioPreview);
                finPreview.setDate(finPreview.getDate() + 6);
                proximaSemanaPreview = { startChunk: inicioPreview, endChunk: finPreview };
            }

            const radius = 40;
            const circumference = 2 * Math.PI * radius;
            let accumulatedPercent = 0;

            const donutSlices = CATEGORIAS_GASTO.map(cat => {
                const amount = porCategoria[cat] || 0;
                const percent = totalGastadoCiclo > 0 ? (amount / totalGastadoCiclo) * 100 : 0;
                const strokeVal = (percent / 100) * circumference;
                const dashOffset = -((accumulatedPercent / 100) * circumference);
                accumulatedPercent += percent;
                return {
                    cat,
                    amount,
                    percent,
                    strokeDasharray: `${strokeVal} ${circumference}`,
                    strokeDashoffset: dashOffset,
                    color: COLORES_CATEGORIA[cat]
                };
            });

            const categoryExpenses = useMemo(() => {
                if (!selectedCategoryModal) return { individual: [], comun: [], totalInd: 0, totalCom: 0 };
                const list = data.expenses.filter(e => (e.category || 'Otros') === selectedCategoryModal);
                const individual = list.filter(e => (e.tipoGasto || 'Individual') === 'Individual');
                const comun = list.filter(e => e.tipoGasto === 'Común');
                const totalInd = individual.reduce((acc, e) => acc + parseFloat(e.amount || 0), 0);
                const totalCom = comun.reduce((acc, e) => acc + parseFloat(e.amount || 0), 0);
                return { individual, comun, totalInd, totalCom };
            }, [data.expenses, selectedCategoryModal]);

            return (
                <div className="space-y-4 animate-fade">
                    {toast && (
                        <div className="toast">
                            {toast}
                        </div>
                    )}

                    {!voiceGuideShown && ReactDOM.createPortal(
                        <div className="modal-overlay bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-[#0f111a] border border-white/10 p-8 rounded-[2.5rem] w-full max-w-sm shadow-2xl animate-fade text-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-500"></div>
                                <div className="w-20 h-20 mx-auto bg-indigo-500/10 rounded-full flex items-center justify-center mb-5 border border-indigo-500/20">
                                    <i className="fa-solid fa-microphone text-4xl text-indigo-400"></i>
                                </div>
                                <h3 className="text-xl font-black text-white mb-2">🎙️ Dicta tus gastos</h3>
                                <p className="text-sm text-slate-400 mb-4">Sin escribir, solo habla</p>
                                <div className="bg-black/40 p-4 rounded-2xl border border-white/5 text-left space-y-3 mb-6">
                                    <div className="flex items-center gap-3">
                                        <span className="text-indigo-400 text-sm">💬</span>
                                        <span className="text-slate-300 text-sm">"40 euros zapatos"</span>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="text-indigo-400 text-sm">💬</span>
                                        <span className="text-slate-300 text-sm">"café 2.50"</span>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="text-indigo-400 text-sm">💬</span>
                                        <span className="text-slate-300 text-sm">"15 euros combustible"</span>
                                    </div>
                                </div>

                                        <>
                                            <h4 className="text-white font-black text-base">Cómo funciona el ciclo</h4>
                                            <p>Tu presupuesto dura <span className="text-white font-bold">28 días</span> desde el día en que le das a "Reiniciar Ciclo" — normalmente el día que cobras. Dentro de esos 28 días, las semanas se alinean al <span className="text-white font-bold">calendario real (lunes a domingo)</span>: si reinicias un sábado, el primer bloque es corto (hasta el domingo) y luego cada semana empieza el lunes, como es natural.</p>
                                            <p><span className="text-white font-bold">Reajuste automático:</span> lo que de verdad te queda del ciclo (presupuesto total menos lo ya gastado en semanas pasadas) se reparte entre los días que faltan. Si una semana gastas menos de lo previsto, la siguiente sube. Si gastas más, baja — para que nunca te quedes sin dinero antes de que acabe el ciclo.</p>
                                            <p>El mensaje "Incluye +X€ / −X€ de semanas anteriores" te indica si esta semana tiene más o menos presupuesto de lo normal por cómo has ido de las semanas anteriores.</p>
                                            <p>Si cobras en una fecha distinta cada mes, no pasa nada: pulsa "Reiniciar Ciclo" el día que efectivamente cobres, y el ciclo se cuenta desde ahí.</p>
                                            <p><span className="text-white font-bold">Restante del mes completo</span> es siempre el presupuesto con el que arrancaste el ciclo (fijado al reiniciarlo) menos todo lo gastado — no cambia aunque se recalculen las semanas, así que siempre refleja la realidad.</p>
                                            <p><span className="text-white font-bold">Botón "Recalcular":</span> si una semana se te va de presupuesto por algo imprevisto, no hace falta reiniciar el ciclo entero. Pulsa "Recalcular" y se ajusta el reparto de lo que queda con los datos reales, sin borrar tus gastos ni el histórico. Cada vez que se recalcula (a mano o automático al cambiar de semana) queda un registro debajo de las semanas, con fecha y motivo, para que puedas mirar atrás y ver qué pasó.</p>
                                            <p>Las semanas ya terminadas dejan de verse en la tarjeta del ciclo (siguen contando por detrás para el reparto). Cuando ya no queda ninguna semana futura del ciclo, aparece una tarjeta de "Próxima" con solo las fechas — un adelanto de la semana que viene, que todavía no cuenta para nada.</p>
                                        </>
                                    )}
                                    {guideTab === 'gastos' && (
                                        <>
                                            <h4 className="text-white font-black text-base">Registrar gastos</h4>
                                            <p>Pulsa el botón <span className="text-white font-bold">"GASTO"</span> (o el micrófono 🎙️ para dictarlo por voz) para añadir un gasto rápido: concepto, importe, categoría, ámbito (Individual o Común) y fecha.</p>
                                            <p>Toca cualquier categoría para ver el desglose de gastos individuales y en común de ese ciclo.</p>
                                            <p>Usa <span className="text-white font-bold">PC</span> para hacer una copia de seguridad manual, el botón de subir archivo para importar gastos de otro móvil sin perder los tuyos, y CSV para exportar el registro completo.</p>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>,
                        document.body
                    )}

                    {selectedCategoryModal && ReactDOM.createPortal(
                        <div className="modal-overlay bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-[#0f111a] border border-white/10 p-6 rounded-[2rem] w-full max-w-sm shadow-2xl animate-fade space-y-4 max-h-[85vh] overflow-y-auto custom-scrollbar">
                                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                                    <div className="flex items-center gap-2">
                                        <span className="w-3.5 h-3.5 rounded-full" style={{ backgroundColor: COLORES_CATEGORIA[selectedCategoryModal] }}></span>
                                        <h3 className="text-base font-black text-white">{selectedCategoryModal}</h3>
                                    </div>
                                    <button onClick={() => setSelectedCategoryModal(null)} className="text-slate-400 p-1"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>

                                <div className="space-y-4 text-xs">
                                    <div className="bg-black/40 p-3.5 rounded-2xl border border-white/5 space-y-2">
                                        <div className="flex justify-between items-center font-bold text-slate-300 border-b border-white/5 pb-1">
                                            <span>Individuales</span>
                                            <span className="text-indigo-400">{categoryExpenses.totalInd.toFixed(2)}€</span>
                                        </div>
                                        {categoryExpenses.individual.length === 0 ? (
                                            <p className="text-slate-400 text-[12px] py-1">Sin gastos individuales.</p>
                                        ) : (
                                            <div className="space-y-1.5 pt-1">
                                                {categoryExpenses.individual.map(e => (
                                                    <div key={e.id} className="flex justify-between items-center text-[12px]">
                                                        <span className="text-white font-medium">{e.name} <span className="text-slate-400 text-[11px]">({formatFechaAmigable(e.fecha)})</span></span>
                                                        <span className="font-bold text-rose-400">-{parseFloat(e.amount).toFixed(2)}€</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div className="bg-black/40 p-3.5 rounded-2xl border border-white/5 space-y-2">
                                        <div className="flex justify-between items-center font-bold text-slate-300 border-b border-white/5 pb-1">
                                            <span>En Común</span>
                                            <span className="text-emerald-400">{categoryExpenses.totalCom.toFixed(2)}€</span>
                                        </div>
                                        {categoryExpenses.comun.length === 0 ? (
                                            <p className="text-slate-400 text-[12px] py-1">Sin gastos en común.</p>
                                        ) : (
                                            <div className="space-y-1.5 pt-1">
                                                {categoryExpenses.comun.map(e => (
                                                    <div key={e.id} className="flex justify-between items-center text-[12px]">
                                                        <span className="text-white font-medium">{e.name} <span className="text-slate-400 text-[11px]">({formatFechaAmigable(e.fecha)})</span></span>
                                                        <span className="font-bold text-rose-400">-{parseFloat(e.amount).toFixed(2)}€</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <button onClick={() => setSelectedCategoryModal(null)} className="w-full py-3 bg-white/10 hover:bg-white/20 text-white rounded-xl font-bold text-xs transition-all">
                                    Cerrar
                                </button>
                            </div>
                        </div>,
                        document.body
                    )}

                    {modalOpen && ReactDOM.createPortal(
                        <div className="modal-overlay bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">
                            <div className="bg-[#0f111a] border border-white/10 p-6 rounded-t-[2.5rem] sm:rounded-[2rem] w-full max-w-sm shadow-2xl animate-fade">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-base font-black text-white">{editingId ? 'Editar Gasto' : 'Añadir Gasto Rápido'}</h3>
                                    <button onClick={handleCloseModal} className="text-slate-400 hover:text-white transition-colors p-1"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <form onSubmit={handleSaveExpense} className="space-y-3">
                                    <div>
                                        <label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Concepto</label>
                                        <div className="flex gap-2 items-center">
                                            <input 
                                                ref={inputRef}
                                                type="text" 
                                                value={formData.name} 
                                                onChange={e => setFormData({...formData, name: e.target.value})} 
                                                className="flex-1 bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500" 
                                                placeholder="Ej: Gasolina, café..." 
                                                required 
                                            />
                                            <button 
                                                type="button"
                                                onClick={startVoiceRecognition}
                                                disabled={!isOnline}
                                                className={`mic-btn p-3 rounded-xl border transition-all flex-shrink-0 relative ${isListening ? 'active bg-rose-500/20 border-rose-500/50 text-rose-400' : isOnline ? 'bg-indigo-500/20 border-indigo-500/30 text-indigo-400 hover:bg-indigo-500/30' : 'bg-slate-700/50 border-slate-600/30 text-slate-400 cursor-not-allowed'}`}
                                                title={isOnline ? 'Dictar por voz' : 'Sin conexión a internet'}
                                            >
                                                <i className={`fa-solid ${isListening ? 'fa-circle-stop' : 'fa-microphone'}`}></i>
                                                {!isOnline && (
                                                    <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-amber-500 rounded-full"></span>
                                                )}
                                            </button>
                                        </div>
                                        {!isOnline && (
                                            <p className="text-[11px] text-amber-400 mt-1">📶 Sin conexión · La voz no está disponible</p>
                                        )}
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Importe (€)</label>
                                            <input 
                                                type="number" 
                                                step="0.01" 
                                                inputMode="decimal"
                                                value={formData.amount} 
                                                onChange={e => setFormData({...formData, amount: e.target.value})} 
                                                className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500" 
                                                placeholder="0.00" 
                                                required 
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Categoría</label>
                                            <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm appearance-none">
                                                {CATEGORIAS_GASTO.map(cat => (
                                                    <option key={cat} value={cat} className="bg-slate-900">{cat}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Ámbito</label>
                                            <select value={formData.tipoGasto} onChange={e => setFormData({...formData, tipoGasto: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm appearance-none">
                                                <option value="Individual" className="bg-slate-900">Individual</option>
                                                <option value="Común" className="bg-slate-900">Común</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Fecha</label>
                                            <input type="date" value={formData.fecha} onChange={e => setFormData({...formData, fecha: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500" required />
                                        </div>
                                    </div>
                                    <div className="flex gap-2 mt-2">
                                        <button type="submit" className="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-sm transition-all shadow-lg active:scale-95">
                                            {editingId ? 'ACTUALIZAR' : 'GUARDAR'}
                                        </button>
                                        <button type="button" onClick={handleCloseModal} className="py-3.5 px-4 bg-white/5 hover:bg-white/10 text-slate-400 rounded-xl font-bold text-sm transition-all active:scale-95">
                                            CANCELAR
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>,
                        document.body
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
